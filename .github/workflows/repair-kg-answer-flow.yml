name: Repair KG answer selection and listening sequence
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate only six checked P1 handwriting files
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess,gzip
          files={'assets/kg1/checks/kg-checks.js': {'before': '4dab7f0dbd860663c76d969b2f95998bf9ce63d24bec49c7eb2f2e82bc696eb2', 'after': '08515c9752869f0c7639f2de2530678483fe84cb3231ab4e78d83e24c54c083e', 'base64': ''}, 'assets/kg1/checks/kg-checks.css': {'before': '3b0e5698c7528892f6d7ddaf645366ca8e92a7c6eeedc6a9d55702904ba5f964', 'after': '3189b021b0648c8c7704f7be92cec91fa03176e475c8993efcd6e4d562401fab', 'base64': ''}, 'assessments-kg1.html': {'before': '849b006a5d8a06b9b7238d9ac6864a9eb20c01b2fdaed920d8cffa8afeb80159', 'after': '1d4004f6dae22f98574208fe2b534331c3b75a43be3ba6a62469959aae7d2388', 'base64': ''}, 'assessments-kg2.html': {'before': 'abe4e4f28e9e50051274f457a648d1d125df3bb6ac997bff31f8dba95a48bbf1', 'after': '3ac907fe01cc5ec99a02c92b90747ba0a02de1627cbd5eb76110ac21cd41d93e', 'base64': ''}, 'test-kg1.html': {'before': '220a7d0cc7368bbb5fbc13ba6617733959f6d1ca5bf83df4d002e2a79902a1c5', 'after': 'd9f62de84004a68993b1e80ed447d57977e1c03b10336ebdfc8586a1585cb019', 'base64': ''}, 'test-kg2.html': {'before': '36dad8482e4bfa95f94dfe1ebd469f4c193033e5a1dcaebee39b61faeb48dca6', 'after': 'e8ca3dcab3b4f037a57f067712ddbca4425c7d0d57acaec48241ee263051339f', 'base64': ''}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(gzip.decompress(base64.b64decode(v['base64'])))==v['after'],n
          for n,v in files.items():pathlib.Path(n).write_bytes(gzip.decompress(base64.b64decode(v['base64'])))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Repair KG answer selection and listening sequence'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
