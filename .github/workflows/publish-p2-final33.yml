name: Publish reviewed P2 interactive booklet
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 <<'PYCODE'
          import pathlib,tarfile,json,subprocess,re,urllib.request,hashlib
          archive=pathlib.Path('/tmp/p2-approved33.tgz')
          urllib.request.urlretrieve('https://drive.usercontent.google.com/download?id=1KNphntuElQFKN1t7xhWUzw-TwXw9TZ32&export=download',archive)
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='62c82ed90d85924270114d64280d0ba172e1b14ebcaf188b22e54d2c74e62b67'
          with tarfile.open(archive) as t:
           names=t.getnames()
           assert all(n.startswith('assets/final-review-p2/') or n in ['final-review-p2.html','final-review-p2.js','final-review-p2-questions.json'] for n in names)
           t.extractall('.',filter='data')
          d=json.loads(pathlib.Path('final-review-p2-questions.json').read_text())
          assert len(d['sections'])==18 and sum(len(s['items'])for s in d['sections'])==432
          p=pathlib.Path('assessments-p2.html');s=p.read_text();s,n=re.subn(r'(<a class="grade-entry" href="final-review-p2.html">).*?(</a>)',r'\1<h2>المراجعة النهائية</h2><p>أسئلة مذكرة المراجعة في أنشطة تفاعلية للمراجعة الذاتية، بدون تصحيح آلي.</p><span class="grade-entry-open">افتح المراجعة النهائية ←</span>\2',s,count=1,flags=re.S);assert n==1;p.write_text(s)
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v32-four'in s;p.write_text(s.replace('english-savant-v32-four','english-savant-v33-p2-final'))
          archive.unlink()
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','final-review-p2.html','final-review-p2.js','final-review-p2-questions.json','assets/final-review-p2','assessments-p2.html','sw.js'],check=True)
          subprocess.run(['git','commit','-m','Publish P2 booklet as ungraded interactive final review'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
