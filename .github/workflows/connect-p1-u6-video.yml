name: Connect checked P1 Unit6 full lesson video
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate only six checked P1 Unit6 player files
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess,gzip
          files={'lessons.json': {'before': 'fec2bba62b8bc74cbbdf588683c38e4ca244777595e40820e40b0d489bc5629d', 'after': '11e75fad46d106bb697e3782ef22e116010cfaa28d2d946c2d6b2f0b26a4006b', 'base64': ''}, 'grade-videos.js': {'before': 'f72be6b62b98ea3d5a48cdbf8b44d130b79a4c340b265254e0e017cfb54f2fe8', 'after': 'aca74f22a0241a0ea847c493dda8cc4d5dc1c515a78b87ed1b8328748fcc8519', 'base64': ''}, 'watch.html': {'before': '6385313972ce584268ebc71b4870c8167741ad346953337b1bfcbeb404704765', 'after': 'bd536b902fa18425b784f0546eb30f737452155c6faefc5880dae1a842a962fe', 'base64': ''}, 'videos-p1.html': {'before': 'f2ae0217af3b6d27c4e3a0bdf09860e9e6a71d0aa8e381db04b294dfa2b927a6', 'after': 'c18cfaaf74984484facae2d7a865f19cc13c0548f852d350a562ac7886c4ff28', 'base64': ''}, 'explain-p1-u6.html': {'before': 'a82cc0067191fa152f0a38436d9b4cb705eaadb55f1540dd0ce6fbc8d0b4b407', 'after': '8b60b44c042c644591390e28a552104c8bcc806be39a7aef0c536bd080520638', 'base64': ''}, 'videos/P1_U6_AR_full_word_lesson.jpg': {'before': None, 'after': '3bb06b4304ce497ac3531d7653565ac32f575d3d26f5d7bc4982c870cd25a85b', 'base64': ''}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(gzip.decompress(base64.b64decode(v['base64'])))==v['after'],n
          for n,v in files.items():pathlib.Path(n).write_bytes(gzip.decompress(base64.b64decode(v['base64'])))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Connect checked P1 Unit6 full lesson video'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
