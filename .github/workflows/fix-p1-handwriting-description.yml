name: Correct handwriting availability descriptions
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate only six checked P1 handwriting files
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess,gzip
          files={'explain-p1-u1.html': {'before': 'edc78f9753b0dd72282edfb35ca4843c51f77e3ade43a79992a307151345bdaf', 'after': '16d94f40b05b024a1dc752559f24dd47258e9e863984667d5a2097673213a604', 'base64': ''}, 'explain-p1-u2.html': {'before': 'cf40aae4c2107930d89fbd3d92b5cb806b061d1ce6e581fa5f1619fd2b536b95', 'after': '36525ea44c56e36d2426ba358b51ef358595ee85e28a805749d42ba800567693', 'base64': ''}, 'explain-p1-u3.html': {'before': '3cd9e26295c47d62891826e9c565654e670891af71f9c3714ef8836c8bedcacb', 'after': 'f0b4efcd02618286517b53b8051afb1a75daaae9c0d106f0fea5b4fe9e6f6473', 'base64': ''}, 'explain-p1-u4.html': {'before': 'c692e442c78c800ff41181463df88ac008e785aac2fdb7913ad98b1accfe9904', 'after': '0f99451e7eeac010f45e4480a94bd85fbc0792fdddbbdeb4b62e1a315eb8c769', 'base64': ''}, 'explain-p1-u5.html': {'before': '0830533cb0f53e8b097e70193bcd3a35c40e698f993a4dfdb40805084efb69aa', 'after': '8d374467b161440bebe1eb63501a60b0530fab103abacd5000587ab2659bcaf0', 'base64': ''}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(gzip.decompress(base64.b64decode(v['base64'])))==v['after'],n
          for n,v in files.items():pathlib.Path(n).write_bytes(gzip.decompress(base64.b64decode(v['base64'])))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Correct handwriting availability descriptions'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
