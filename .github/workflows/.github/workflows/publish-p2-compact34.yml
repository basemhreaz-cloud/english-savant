name: Compact P2 review controls and natural colors
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 <<'PYCODE'
          import pathlib,tarfile,json,subprocess,re,urllib.request,hashlib
          archive=pathlib.Path('/tmp/p2-compact34.tgz')
          urllib.request.urlretrieve('https://drive.usercontent.google.com/download?id=1Q2HiTHwNqaeZhBbNotu0SZNAIk8JZXra&export=download',archive)
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='3aab939b0fba6030b6a87827f34b408b6dc88d94ccdc022deea5a8d7ebd5eb15'
          with tarfile.open(archive) as t:
           names=t.getnames()
           assert all(n.startswith('assets/final-review-p2/') or n in ['final-review-p2.html','final-review-p2.js','final-review-p2-questions.json'] for n in names)
           t.extractall('.',filter='data')
          d=json.loads(pathlib.Path('final-review-p2-questions.json').read_text())
          assert len(d['sections'])==18 and sum(len(s['items'])for s in d['sections'])==432
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v33-p2-final'in s;p.write_text(s.replace('english-savant-v33-p2-final','english-savant-v34-p2-compact'))
          archive.unlink()
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','final-review-p2.html','final-review-p2.js','final-review-p2-questions.json','assets/final-review-p2','assessments-p2.html','sw.js'],check=True)
          subprocess.run(['git','commit','-m','Compact P2 review controls and color original illustrations'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
