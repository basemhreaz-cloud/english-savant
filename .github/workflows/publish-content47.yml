name: Complete reviewed P2 lesson additions
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed additions preserving originals
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,base64,zlib,json,re
          expected={'lesson-assessment-p2-u1.json': 'ffe518c68dfa2957323943e7f7cd9d2a541b14408a4d0495b2e88c560c4eb5df', 'lesson-assessment-p2-u2.json': 'd377c17aa64e76e6545b79bb2063b4469118c4da8a4e046017682ed71912edf2', 'lesson-assessment-p2-u3.json': 'b6a35b17153b01770f0982eb22325eeaf5440be016121ec81d5b04efe866f9ed', 'lesson-assessment-p2-u4.json': '34af8ca9776e11baf1969b6cdc4f5c15e0f8e3e0363d49fedb813ae22fb5297d', 'lesson-assessment-p2-u5.json': '1858c4f9d4d237a8becf8068c8328cd897deab223f02d7327185ef5a32cd466a', 'lesson-assessment-p2-u6.json': '65240de306bc6651e267166f35408782b6767b01440cbd875e265aa58a3e886e', 'lesson-assessment-p2.js': '4229b6931240f80b51565b0d40ba1e202522dc3e55aa6871d1eaf95acd0a05c8'}
          for n,h in expected.items():
           p=pathlib.Path(n);assert hashlib.sha256(p.read_bytes()).hexdigest()==h,n
          payload=json.loads(zlib.decompress(base64.b64decode('')))
          for n,b in payload.items():pathlib.Path(n).write_bytes(base64.b64decode(b))
          for p in pathlib.Path(".").glob("lesson-assessment-p2-u*.html"):
           s=p.read_text();s=re.sub(r"lesson-assessment-p2\.js\?v=[^\"\s>]+","lesson-assessment-p2.js?v=20261123-content47",s);p.write_text(s)
          p=pathlib.Path("sw.js");s=p.read_text();assert "english-savant-v46-polish" in s;p.write_text(s.replace("english-savant-v46-polish","english-savant-v47-p2-lessons"))
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add lesson-assessment-p2* sw.js
          git commit -m "Add reviewed source-aligned P2 lesson practice"
          git push origin HEAD:main
