name: Publish verified KG HD Release asset
on:
  workflow_dispatch:
    inputs:
      unit:
        type: choice
        required: true
        options: [u3, u4]
      manifest_sha256:
        type: string
        required: true
      file_sha256:
        type: string
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UNIT: ${{ inputs.unit }}
      MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
      FILE_SHA: ${{ inputs.file_sha256 }}
    steps:
      - name: Verify complete media and publish only its exact HD asset
        run: |
          python3 <<'PY'
          import os,json,re,hashlib,urllib.request,urllib.error,urllib.parse
          from pathlib import Path
          unit=os.environ['UNIT']; mh=os.environ['MANIFEST_SHA']; fh=os.environ['FILE_SHA']
          assert unit in ('u3','u4') and re.fullmatch('[a-f0-9]{64}',mh) and re.fullmatch('[a-f0-9]{64}',fh)
          n=unit[1:]; repo='basemhreaz-cloud/english-savant'; api='https://api.github.com/repos/'+repo
          tag='kg2-'+unit+'-hd-20261122'; filename='ES_KG2_T1_U'+n+'_HD.mp4'; mn='KG2_U'+n+'_HD_upload_manifest.json'
          title='KG2 Unit '+n+': '+{'u3':'My Week!','u4':'My Busy Day!'}[unit]+' | Full Arabic HD lesson'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          def req(url,method='GET',data=None,binary=False):
            if not url.startswith('https://'): url=api+url
            host=urllib.parse.urlsplit(url).hostname
            assert host in ('api.github.com','uploads.github.com')
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/octet-stream' if binary else 'application/vnd.github+json','User-Agent':'english-savant-verified-media'}
            if isinstance(data,(dict,list)): data=json.dumps(data).encode();headers['Content-Type']='application/json'
            elif data is not None: headers['Content-Type']='video/mp4'
            request=urllib.request.Request(url,data=data,headers=headers,method=method)
            try:
              with opener.open(request,timeout=180) as r: b=r.read()
            except urllib.error.HTTPError as e:
              if not binary or e.code not in (301,302,303,307,308): raise
              loc=e.headers['Location']; p=urllib.parse.urlsplit(loc)
              assert p.scheme=='https' and p.hostname in ('release-assets.githubusercontent.com','objects.githubusercontent.com')
              with urllib.request.urlopen(urllib.request.Request(loc,headers={'User-Agent':'english-savant-verified-media'}),timeout=180) as r: b=r.read()
            return b if binary else (json.loads(b) if b else None)
          releases=req('/releases?per_page=100'); candidates=[r for r in releases if r['tag_name']==tag and r['name']==title]
          assert len(candidates)==1,'Expected one exact transfer release'
          release=candidates[0]; rid=release['id']; assets={re.sub(r'^\d+-','',a['name']):a for a in release['assets']};assert len(assets)==len(release['assets']),'Ambiguous staged asset names'
          def getasset(a): return req('/releases/assets/'+str(a['id']),binary=True)
          final=assets.get(filename)
          if final:
            raw=getasset(final); assert hashlib.sha256(raw).hexdigest()==fh and len(raw)==final['size']; del raw
          if not release['draft']:
            assert final and set(assets)=={filename},'Published release needs inspection'
            print(json.dumps({'stage':'ALREADY_PUBLISHED','release':release['html_url'],'media':final['browser_download_url'],'sha256':fh}));raise SystemExit
          if mn in assets:
            manifest_bytes=getasset(assets[mn]);assert hashlib.sha256(manifest_bytes).hexdigest()==mh
            m=json.loads(manifest_bytes);assert m['tag']==tag and m['file']==filename and m['sha256']==fh
            assert m['width']==1920 and m['height']==1080 and m['fps']==30 and 0<m['bytes']<2*1024**3
            assert 1<=len(m['parts'])<=100 and len({p['name']for p in m['parts']})==len(m['parts'])
            expected={mn,filename}|{p['name']for p in m['parts']};assert set(assets)<=expected and set(assets)>={mn}
            if not final:
              assembled=Path('/tmp/verified-hd.mp4'); h=hashlib.sha256(); total=0
              with assembled.open('wb') as out:
                for i,p in enumerate(m['parts']):
                  assert p['name']=='KG2_U'+n+'_HD_upload.part'+str(i).zfill(2)
                  assert 0<p['bytes']<=24000000 and re.fullmatch('[a-f0-9]{64}',p['sha256'])
                  a=assets[p['name']];assert a['size']==p['bytes'];b=getasset(a)
                  assert len(b)==p['bytes'] and hashlib.sha256(b).hexdigest()==p['sha256'];h.update(b);total+=len(b);out.write(b)
              assert total==m['bytes'] and h.hexdigest()==fh
              upload=release['upload_url'].split('{')[0]+'?name='+urllib.parse.quote(filename)
              final=req(upload,'POST',assembled.read_bytes());assert final['name']==filename and final['size']==m['bytes']
              raw=getasset(final);assert len(raw)==m['bytes'] and hashlib.sha256(raw).hexdigest()==fh;del raw
            assert final['size']==m['bytes']
            for p in m['parts']:
              if p['name'] in assets: req('/releases/assets/'+str(assets[p['name']]['id']),'DELETE')
            req('/releases/assets/'+str(assets[mn]['id']),'DELETE')
          else:
            assert final and set(assets)=={filename},'Missing checked transfer manifest'
          current=req('/releases/'+str(rid));assert {a['name']for a in current['assets']}=={filename}
          published=req('/releases/'+str(rid),'PATCH',{'draft':False,'prerelease':False,'make_latest':'false'})
          assert not published['draft'] and len(published['assets'])==1
          print(json.dumps({'stage':'PUBLISHED','release':published['html_url'],'media':published['assets'][0]['browser_download_url'],'bytes':published['assets'][0]['size'],'sha256':fh}))
          PY
