name: Publish checked site navigation consistency
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ES_MANIFEST_0: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Download checked navigation bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/octet-stream' repos/$GITHUB_REPOSITORY/releases/assets/779089081 > /tmp/checked-navigation.zip
      - name: Verify and publish exact checked files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,lzma,hashlib,pathlib,zipfile,subprocess,urllib.request
          raw=lzma.decompress(base64.b64decode(''.join(os.environ['ES_MANIFEST_'+str(i)] for i in range(1))))
          assert hashlib.sha256(raw).hexdigest()=='7068248a6252fe2f833199e178f36a27cc086a071ab99bca09b16880712a71eb'
          p=json.loads(raw);expected=set(p['files']);archive=pathlib.Path('/tmp/checked-navigation.zip')
          assert len(expected)==222
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==p['zip_sha256']
          for name,record in p['files'].items():
              f=pathlib.Path(name)
              assert not f.is_absolute() and '..' not in f.parts
              assert (hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else None)==record['before'],'Concurrent change: '+name
          with zipfile.ZipFile(archive) as z:
              assert set(z.namelist())==expected and len(z.namelist())==len(expected)
              files={name:z.read(name) for name in expected}
          for name,data in files.items():
              assert hashlib.sha256(data).hexdigest()==p['files'][name]['after'],'Integrity mismatch: '+name
          for name,data in files.items():pathlib.Path(name).write_bytes(data)
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(expected),check=True)
          subprocess.run(['git','commit','-m','Unify grade navigation and fix shared dark card contrast'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/pages/builds',method='POST',data=b'{}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req) as r:print('Pages build requested:',r.status)
          PY
      - name: Remove only the consumed private transfer draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/releases/454451401 > /tmp/navigation-draft.json
          python3 -c "import json; p=json.load(open('/tmp/navigation-draft.json')); assert p['draft'] is True and p['name']=='Checked website navigation transfer' and [x['id'] for x in p['assets']]==[779089081]"
          gh api --method DELETE repos/$GITHUB_REPOSITORY/releases/454451401
