name: Repair P2 Unit1 short a gloss
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python -m pip install -q gdown
          gdown 1VYebU5JKy9B2bKbHnpnYMbLC5M8v1H8p -O /tmp/U1.mp4
          echo 'a125b86382c9f353fcc01f8c0da1db56e679128573cd5d4b9891d6bf25ad5f5f  /tmp/U1.mp4' | sha256sum -c -
          mv /tmp/U1.mp4 videos/ES_P2_T1_U1.mp4
          python3 <<'PY'
          import pathlib,json
          p=pathlib.Path('lessons.json');s=p.read_text();a='videos/ES_P2_T1_U1.mp4';assert s.count(a)==1;p.write_text(s.replace(a,a+'?v=20261123-36'))
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v35-p2-controls'in s;p.write_text(s.replace('english-savant-v35-p2-controls','english-savant-v36-p2-u1-video'))
          PY
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add videos/ES_P2_T1_U1.mp4 lessons.json sw.js
          git commit -m 'Repair P2 Unit1 short a Arabic gloss only'
          git push origin HEAD:main
