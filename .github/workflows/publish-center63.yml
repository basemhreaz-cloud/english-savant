name: Center P2 answer fields and verify buttons
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded display corrections
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,re,base64,zlib
          frozen={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.suffix in ['.js','.json'] and str(p) not in ['sw.js','site-interface.js']}
          p=pathlib.Path('site-interface.js');assert hashlib.sha256(p.read_bytes()).hexdigest()=='8f76b7a5acc29a1a6de08fea58c148cb8a65d9713ca71a077416f18e6ea1354c';p.write_bytes(p.read_bytes()+zlib.decompress(base64.b64decode('eJxFj7FqAzEQRHt/RTrtgk8HLm0uLux0CSnShsBGWtsCWSukvYA5379HF0jSDcPMG2YFgMPjdBqT0yDpoSoVBZzCCXrYbz/uHeZNE9393WJvlatCFEdL2GbSS6Ir25pjUDC9QZslAyJ6ceOVk9pP8TfrItX6HKpa8h4M1y5vOidJi8RqcG5rf4XC5G9vSsrDMJgo5EM6m39gIzx9NbHgOHEBc3x9OTTW4rU0e7P+ebGeJDneahl5xh3Hyr/vZgTcrb4B7YFW6w==')))
          p=pathlib.Path('site-interface.css');assert hashlib.sha256(p.read_bytes()).hexdigest()=='f7c8ccd51be7c9b9725c94fdba98f742e539dcd05318d377dac56972a233b247';p.write_bytes(p.read_bytes()+zlib.decompress(base64.b64decode('')))
          for p in pathlib.Path('.').glob('*.html'):
           if p.name.startswith('google'):continue
           s=p.read_text();s=re.sub(r'site-interface.(css|js)\?v=[^"\s>]+',lambda m:'site-interface.'+m.group(1)+'?v=20261123-center63',s);p.write_text(s)
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v62-word' in s;p.write_text(s.replace('english-savant-v62-word','english-savant-v63-center'))
          assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in frozen.items()),'code/data changed'
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add '*.html' site-interface.css site-interface.js sw.js
          git commit -m "Center P2 responses below words and pictures"
          git push origin HEAD:main
