name: Connect checked P1 Unit4 full lesson video
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate only six checked P1 Unit4 player files
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess,gzip
          files={'lessons.json': {'before': '214b4158671bbe4d981f8ea52318f2fa5f27a1797b8beae25dc906128b7bd921', 'after': 'cad7c6771ca5271600bd290e0ff43e1e2aaf7368f35526601afcaadaf8f0753a', 'base64': ''}, 'grade-videos.js': {'before': 'a08ee7ab126f2cf1f4a585d6554e1fa6493e2b025e4d9620149e4175a53b2a9f', 'after': 'd56b5314b20f68ee334a4b5eaedcce6150283f9231723c21c774aff2cdd03db0', 'base64': ''}, 'watch.html': {'before': '6e06fbb6ac82840255adf926b64410f1f71a802a33f0213ed770803598a4fccc', 'after': '7d1847901e9b612a7018d126db789bd6bc8d49dd6c6f2d39b697d1484a4aa675', 'base64': ''}, 'videos-p1.html': {'before': 'aa78c2059185fdbe063858aa741512ff500c2f6f2e9062184ae8be1372517c99', 'after': 'fd1ac696a0e74688b2b8e4e2680a668e57923ff665c8a87a82c746478ceaae49', 'base64': ''}, 'explain-p1-u4.html': {'before': '100b2492dd61bfea0278af252107854961b7acfde92083d1f5f4c1346e45471f', 'after': 'f7ea8fd2600a59d3bf59a8bcaaa734ddefdc5812cbe29786eec81f9abdda32a6', 'base64': ''}, 'videos/P1_U4_AR_full_word_lesson.jpg': {'before': None, 'after': '5c7a8f8cab2b5445e2bfab3a16ea674702a01c430980e63699d996d01913656e', 'base64': ''}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(gzip.decompress(base64.b64decode(v['base64'])))==v['after'],n
          for n,v in files.items():pathlib.Path(n).write_bytes(gzip.decompress(base64.b64decode(v['base64'])))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Connect checked P1 Unit4 full lesson video'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
