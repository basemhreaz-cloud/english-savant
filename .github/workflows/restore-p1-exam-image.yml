name: Restore checked P1 ten-star exam image
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore only verified missing image
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib
          p=pathlib.Path('p1-lessons-assets/img/count-stars-10.png')
          b=base64.b64decode('')
          assert hashlib.sha256(b).hexdigest()=='f90286410217d581918da272b81c2d1f60715668abf451be18640e0b499424b0'
          assert not p.exists() or p.read_bytes()==b
          p.write_bytes(b)
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add -- p1-lessons-assets/img/count-stars-10.png
          git diff --cached --quiet && exit 0
          git commit -m 'Restore checked ten-star image for P1 unit exam'
          git push origin HEAD:main
