name: Translate video and tool shells
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 <<'PYCODE'
          import pathlib,hashlib,base64,gzip,subprocess,re
          f=pathlib.Path('site-interface.js');assert hashlib.sha256(f.read_bytes()).hexdigest()=='e728f5944a3409eb0b908bcfa716234387e30e0ce59062e756e4b7cead8ed767'
          f.write_bytes(gzip.decompress(base64.b64decode('')))
          f=pathlib.Path('site-interface.css');assert hashlib.sha256(f.read_bytes()).hexdigest()=='2a0a27764064294ca2a902a36d87bf82abc46f4c21edfbd05dd2d3faa668fa56'
          f.write_bytes(gzip.decompress(base64.b64decode('')))
          changed=['site-interface.js', 'site-interface.css']
          for f in pathlib.Path('.').glob('*.html'):
           s=f.read_text();t=re.sub(r'site-interface\.(js|css)(?:\?v=[A-Za-z0-9_-]+)?',lambda m:'site-interface.'+m[1]+'?v=20261123-shell21',s)
           if s!=t:f.write_text(t);changed.append(str(f))
          f=pathlib.Path('sw.js');s=f.read_text();t=s.replace('english-savant-v20-bankvalidation','english-savant-v21-shell');assert t!=s;f.write_text(t);changed.append('sw.js')
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',*changed],check=True)
          subprocess.run(['git','commit','-m','Translate video and tool shells and mirror KG practice instructions'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
