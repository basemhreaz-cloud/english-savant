name: Fix mirrored tool card spacing
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 <<'PYCODE'
          import pathlib,re,hashlib,gzip,base64,subprocess
          expected={'index.html': 'd7f4b7b75af7262f4a75fc67f831e361be029cacec0d8c83b6933d932e4111fe', 'tools.html': 'f05ab411d989b2aba8d51907de4c64f09dafefd40f26e88b0633ee741fa914aa', 'site-interface.css': 'eefa812f6a769f50de470fb7876c76ca898abdf97bbc018013ac3661b7dfe2de', 'site-interface.js': '7ba757798190058da32344d0d99d15f32b0137de427632a62d74b5312d210c78', 'sw.js': '5a4ee965ccb1df68ef8f007c50c9fde93a47d32e7226c6a79833e46388120d31'}
          payload={'site-interface.css': '', 'site-interface.js': ''}
          for n in payload:
           assert hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==expected[n],n
          for n,v in payload.items():pathlib.Path(n).write_bytes(gzip.decompress(base64.b64decode(v)))
          changed=list(payload)
          for f in pathlib.Path('.').glob('*.html'):
           s=f.read_text();t=s.replace('site-interface.css?v=20261123-ui9','site-interface.css?v=20261123-card11').replace('site-interface.js?v=20261123-ui9','site-interface.js?v=20261123-card11')
           if t!=s:f.write_text(t);changed.append(str(f))
          f=pathlib.Path('sw.js');s=f.read_text();t=s.replace('english-savant-v10-png','english-savant-v11-cards');assert t!=s;f.write_text(t);changed.append('sw.js')
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',*changed],check=True)
          subprocess.run(['git','commit','-m','Fix mirrored tool card icon spacing and rectangular badges'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
