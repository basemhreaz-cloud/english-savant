name: Translate course and article catalogue interface
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 <<'PYCODE'
          import pathlib,hashlib,base64,gzip,subprocess,re
          f=pathlib.Path('site-interface.js');assert hashlib.sha256(f.read_bytes()).hexdigest()=='a321f9a0ee0ff85fdb9a268ab2acd5582a3ba77c4c02d614d7a5ead3e65de76d'
          f.write_bytes(gzip.decompress(base64.b64decode('')))
          changed=['site-interface.js']
          for f in pathlib.Path('.').glob('*.html'):
           s=f.read_text();t=re.sub(r'site-interface\.js(?:\?v=[A-Za-z0-9_-]+)?', 'site-interface.js?v=20261123-catalog15',s)
           if s!=t:f.write_text(t);changed.append(str(f))
          f=pathlib.Path('sw.js');s=f.read_text();t=s.replace('english-savant-v14-assistant','english-savant-v15-catalog');assert t!=s;f.write_text(t);changed.append('sw.js')
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',*changed],check=True)
          subprocess.run(['git','commit','-m','Translate remaining course and article catalogue interface'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
