name: Finish checked P1 Unit6 interactive handwriting
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate only six checked P1 handwriting files
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess,gzip
          files={'p1-handwriting.js': {'before': '6ba1b814c25cbebb3d9272c5e724fd83d3ff53252bf9e2d81302037964bc5f27', 'after': '798e1d3f48536568a9b9189937b0867ea0d35733fa3a88e5a8b73f314d513ea5', 'base64': ''}, 'explain-p1-u1.html': {'before': '16d94f40b05b024a1dc752559f24dd47258e9e863984667d5a2097673213a604', 'after': 'b865f428cc99e1c52b7081fb3423ae831e5feef0a9b648786512e118e9f6a91f', 'base64': ''}, 'explain-p1-u2.html': {'before': '36525ea44c56e36d2426ba358b51ef358595ee85e28a805749d42ba800567693', 'after': '045e70771e9ff137b8c603b46d03d48e82a77fd53fc53ac1620d7fd4fff40273', 'base64': ''}, 'explain-p1-u3.html': {'before': 'f0b4efcd02618286517b53b8051afb1a75daaae9c0d106f0fea5b4fe9e6f6473', 'after': '9c8420edaa9537c34a51fd3c0c5a488d7ebb75091647b5c2e68b9fb6d0e20fbb', 'base64': ''}, 'explain-p1-u4.html': {'before': '0f99451e7eeac010f45e4480a94bd85fbc0792fdddbbdeb4b62e1a315eb8c769', 'after': '2e8ca2b57a8535b5933c70479150a28d58d6fc471c0902efb6c912bc9809c3c2', 'base64': ''}, 'explain-p1-u5.html': {'before': '8d374467b161440bebe1eb63501a60b0530fab103abacd5000587ab2659bcaf0', 'after': '818441d8af585b248ed5cefd1123f5ce93b9f3c1492a0cb8134d8a8e44898375', 'base64': ''}, 'explain-p1-u6.html': {'before': '8b60b44c042c644591390e28a552104c8bcc806be39a7aef0c536bd080520638', 'after': 'c334f11b3ca992883a41cb83042faffb871c7303034f531d4524995c5885b1df', 'base64': ''}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(gzip.decompress(base64.b64decode(v['base64'])))==v['after'],n
          for n,v in files.items():pathlib.Path(n).write_bytes(gzip.decompress(base64.b64decode(v['base64'])))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Finish checked P1 Unit6 interactive handwriting'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
