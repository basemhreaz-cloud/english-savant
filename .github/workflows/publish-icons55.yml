name: Unify remaining decorative UI icons
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply decorative symbols with preservation guards
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,re,base64,zlib,json
          expected={'site-interface.css': '93796bf7e561b577a0713778d810316995a8bedc9d8dfa6aad29aef8b77ace64', 'site-interface.js': 'c877c918e97505272ba698bd715ec2b8e6a6d38af5346d2fc4dd216cf70b3b24'}
          for n,h in expected.items():assert hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h,n
          frozen={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.suffix in ['.js','.json'] and str(p) not in ['sw.js','site-interface.js']}
          payload={'site-interface.css': '', 'site-interface.js': ''}
          for n,b in payload.items():pathlib.Path(n).write_bytes(zlib.decompress(base64.b64decode(b)))
          for p in pathlib.Path('.').glob('*.html'):
           if p.name.startswith('google'):continue
           s=p.read_text()
           for n in ['site-interface.css','site-interface.js']:s=re.sub(re.escape(n)+r'\?v=[^"\s>]+',n+'?v=20261123-icons55',s)
           p.write_text(s)
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v53-nav' in s;p.write_text(s.replace('english-savant-v53-nav','english-savant-v55-icons'))
          assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in frozen.items()),'educational code/data changed'
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add '*.html' site-interface.css site-interface.js sw.js
          git commit -m "Unify decorative tool goal and assessment symbols"
          git push origin HEAD:main
