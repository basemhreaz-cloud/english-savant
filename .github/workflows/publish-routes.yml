name: Translate resources results Saudi and KG interface
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 <<'PYCODE'
          import pathlib,hashlib,base64,gzip,subprocess,re
          f=pathlib.Path('site-interface.js');assert hashlib.sha256(f.read_bytes()).hexdigest()=='a5927782aa26990226baf10621b9ce2bef3de62195fea4ac0a79b56004ba11a9'
          f.write_bytes(gzip.decompress(base64.b64decode('')))
          changed=['site-interface.js']
          for f in pathlib.Path('.').glob('*.html'):
           s=f.read_text();t=re.sub(r'site-interface\.js(?:\?v=[A-Za-z0-9_-]+)?', 'site-interface.js?v=20261123-routes17',s)
           if s!=t:f.write_text(t);changed.append(str(f))
          f=pathlib.Path('sw.js');s=f.read_text();t=s.replace('english-savant-v16-residual','english-savant-v17-routes');assert t!=s;f.write_text(t);changed.append('sw.js')
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',*changed],check=True)
          subprocess.run(['git','commit','-m','Translate resources results Saudi and KG instructions'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
