name: Publish KG1 Unit 1 word lesson
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Download the checked lesson media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/octet-stream' repos/$GITHUB_REPOSITORY/releases/assets/778821774 > /tmp/kg1-u1-word-lesson.mp4
      - name: Verify and publish the word-based lesson
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,lzma,base64,hashlib,pathlib,subprocess,urllib.request,shutil
          raw=lzma.decompress(base64.b64decode(b''.join(pathlib.Path('.github/workflows/kg1-u1-video-web-payload-'+str(i)+'.txt').read_bytes() for i in range(2))))
          assert hashlib.sha256(raw).hexdigest()=='815576cb4fe0b05bffa19606b27eb3b1220803f50896988e22461f990f73b6e7'
          p=json.loads(raw)
          expected={'grade-kg1.html','grades.html','videos/ES_KG1_T1_U1.jpg','videos/ES_KG1_T1_U1.mp4'}
          assert set(p['before'])==expected and set(p['after'])==expected
          for name,old in p['before'].items():
              f=pathlib.Path(name)
              assert (hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else None)==old,'Concurrent change: '+name
          for name,value in p['files'].items():
              b=base64.b64decode(value)
              assert hashlib.sha256(b).hexdigest()==p['after'][name]
              pathlib.Path(name).write_bytes(b)
          b=pathlib.Path('/tmp/kg1-u1-word-lesson.mp4').read_bytes()
          assert hashlib.sha256(b).hexdigest()==p['after']['videos/ES_KG1_T1_U1.mp4'],'Video integrity mismatch'
          pathlib.Path('videos/ES_KG1_T1_U1.mp4').write_bytes(b)
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(expected),check=True)
          subprocess.run(['git','commit','-m','Publish KG1 Unit 1 word-based lesson video'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          repo=os.environ['GITHUB_REPOSITORY']
          req=urllib.request.Request('https://api.github.com/repos/'+repo+'/pages/builds',method='POST',data=b'{}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req) as r:print('Pages build requested:',r.status)
          print('Verified lesson files published:',len(expected))
          PY
      - name: Remove the temporary unpublished media draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/releases/454395114 --jq '{draft,name}' > /tmp/kg1-draft.json
          python3 -c "import json; p=json.load(open('/tmp/kg1-draft.json')); assert p['draft'] is True and p['name']=='KG1 U1 website media transfer'"
          gh api --method DELETE repos/$GITHUB_REPOSITORY/releases/454395114
