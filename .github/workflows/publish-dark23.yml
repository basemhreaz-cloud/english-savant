name: Fix shared assessment dark surfaces
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 <<'PYCODE'
          import pathlib,hashlib,base64,gzip,subprocess,re
          f=pathlib.Path('site-interface.css');assert hashlib.sha256(f.read_bytes()).hexdigest()=='7fbd2e99732d2bcc743bce2dcb0cdf3a56fd4ef5b7dbaed3082174c78547f632'
          b=gzip.decompress(base64.b64decode(''));assert hashlib.sha256(b).hexdigest()=='48712c0d0fd2f978bb021dd541e2185a3d21d2de761aa9a0c39bee9fdf0e21f6';f.write_bytes(b)
          changed=['site-interface.css']
          for f in pathlib.Path('.').glob('*.html'):
           s=f.read_text();t=re.sub(r'site-interface\.(js|css)(?:\?v=[A-Za-z0-9_-]+)?',lambda m:'site-interface.'+m[1]+'?v=20261123-dark23',s)
           if s!=t:f.write_text(t);changed.append(str(f))
          f=pathlib.Path('sw.js');s=f.read_text();t=s.replace('english-savant-v22-kg2ui','english-savant-v23-dark');assert t!=s;f.write_text(t);changed.append('sw.js')
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',*changed],check=True)
          subprocess.run(['git','commit','-m','Fix shared assessment dark surfaces'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
