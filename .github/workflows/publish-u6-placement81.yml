name: Publish checked P3 U6 exam and review placement
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guarded publication
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,json,zlib,base64
          expected={'grade-p5.html': '1c3b58098154f19ba259f3b64cc512d1df15a72a9548a830d2c352e3c56d4a59', 'assessments-p5.html': '81032c0efcc77d0c78698a3975e81c45587a74d30072f4f2e890e481e42bb6d7', 'grade-m2.html': 'a5d2404632467d64359eafd41b0ce842f635f85623faa8425e57f30037115a54', 'assessments-m2.html': '11fae34f5d53ba841c7e240486bdc6035b14bb3595b224d2cf76d9c80d7a9f93', 'grade-m1.html': '5d0271acac266ebfc1e17571ba87bb3f91dbfd8cb593fb3ec6cddfe6d434fde3', 'assessments-m1.html': 'f6ec7df7bbf741502c3ab0face6de255b83407311958eeb8506b616ad414489c', 'grade-p4.html': '3f2e8ea385d5ff479875529c9ae1a647c6ab4715a76647c92454dcbee6683dee', 'assessments-p4.html': 'e62d365ec637b1e3ca1005c3d61b073ab357c6f48e76ca59e71c1da617ca74df', 'grade-p6.html': '7cc0e5483db35cd7ca1e5d38fea95e4acf6d319c1883f90f337e96d353ee4d78', 'assessments-p6.html': '377f102a328db69cb2888f7005a0c6f406e9f5c864c0d7071b966ace34e332dd', 'grade-m3.html': '827f1ec24d1938bf8e53369ff4a9138fe6c78710446e470e54286fcda9f4bf56', 'assessments-m3.html': 'cd557bb64910dd49c34644a7160f34253888613624c75e4ddea6b06bba948b35', 'grade-p3.html': '7bcfa43c444b35eeaa3d7406035f540a42ea98f8b268f5e4bf7cc4d11fa7c0af', 'assessments-p3.html': 'fe2d8e4022dd7b3bccd43a4e8473b5661153a2d8342506979d74f7f6c9c52f47', 'lesson-assessment-p3-u5.html': '1c09f98833659af146a1fcf3bb93c535c1d67826a893a9f6a22fbe499419ff05', 'test-p3.html': 'eb182e41e3ade37499d0eaefbba3b8c51fbae7d7f7cf90c90b255cad74da6f0d', 'sw.js': 'a6a1455b4af122ab59258a29d2686d0d1a7949394907097c77b106ce8510cf67'}
          for n,h in expected.items():assert hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h,n
          banks={str(p):hashlib.sha256(p.read_bytes()).hexdigest()for p in pathlib.Path('.').rglob('*.json')if '.git'not in p.parts}
          files=json.loads(zlib.decompress(base64.b64decode(''.join([
          '',
          '',
          '',
          '',
          '',
          '',
          '',
          '',
          '',
          '',
          ]))))
          for n,b in files.items():
           p=pathlib.Path(n);assert '..'not in p.parts and not p.is_absolute();p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(b))
          assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in banks.items())
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add '*.html' unit-exam-p3-u6.json p3-lessons-assets sw.js
          git commit -m "Publish checked P3 U6 exam and nest final reviews under assessments"
          git push origin HEAD:main
