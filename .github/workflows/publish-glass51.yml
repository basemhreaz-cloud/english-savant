name: Apply shared glass design foundation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual CSS only with preservation guards
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,base64,zlib,re
          p=pathlib.Path('site-interface.css')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='16ab830489b52c721fb0e09743c0e156281b1e9fd20d216dfc7f2fd97893c13b','interface changed'
          sw=pathlib.Path('sw.js')
          assert hashlib.sha256(sw.read_bytes()).hexdigest()=='df644595ecb3b111b8d502dbca6e33e78334d023d853869f124654dd09dd0cec','worker changed'
          frozen={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.suffix in ['.js','.json'] and str(p)!='sw.js'}
          p.write_bytes(zlib.decompress(base64.b64decode('')))
          for p in pathlib.Path('.').glob('*.html'):
           if p.name.startswith('google'):continue
           s=p.read_text();s=re.sub(r'site-interface.css\?v=[^"\s>]+','site-interface.css?v=20261123-glass51',s);p.write_text(s)
          s=sw.read_text();assert 'english-savant-v50-controls' in s;sw.write_text(s.replace('english-savant-v50-controls','english-savant-v51-glass'))
          assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in frozen.items()),'frozen code/data changed'
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add '*.html' site-interface.css sw.js
          git commit -m "Add shared glass visual foundation and readable navigation"
          git push origin HEAD:main
