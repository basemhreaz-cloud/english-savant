name: Correct English title direction and remaining inset strip
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 <<'PYCODE'
          import pathlib,hashlib,base64,gzip,subprocess
          f=pathlib.Path('site-interface.css');assert hashlib.sha256(f.read_bytes()).hexdigest()=='3900693cc117427311113d5b21012487bfd096925385c39098ed859ef7c1b94b'
          f.write_bytes(gzip.decompress(base64.b64decode('')))
          f=pathlib.Path('site-interface.js');assert hashlib.sha256(f.read_bytes()).hexdigest()=='068755e93a38da17eb12bc4c5dba66e1f21de5f8cdc0f15e8739b229061602b4'
          f.write_bytes(gzip.decompress(base64.b64decode('')))
          changed=['site-interface.css','site-interface.js']
          for f in pathlib.Path('.').glob('*.html'):
           s=f.read_text();t=s.replace('site-interface.css?v=20261123-glass12','site-interface.css?v=20261123-flow13').replace('site-interface.js?v=20261123-card11','site-interface.js?v=20261123-flow13')
           if s!=t:f.write_text(t);changed.append(str(f))
          f=pathlib.Path('sw.js');s=f.read_text();t=s.replace('english-savant-v12-glass','english-savant-v13-flow');assert t!=s;f.write_text(t);changed.append('sw.js')
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',*changed],check=True)
          subprocess.run(['git','commit','-m','Preserve English heading direction and semantic back link; inset assessment strip'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
