name: Publish checked P3 Unit5 lesson assessments
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish checked P3 Unit5 only
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,json,base64,zlib
          p=pathlib.Path('assessments-p3.html');assert hashlib.sha256(p.read_bytes()).hexdigest()=='0ce2a03acaf89970a442077c97f2e68a1a2aea0840722f44defbeb62a9eecabd'
          frozen={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('.').glob('*.json')}
          files=json.loads(zlib.decompress(base64.b64decode(pathlib.Path('.github/workflows/payload74-0.txt').read_text().strip())))
          assert set(files)=={'lesson-assessments-p3.html', 'lesson-assessment-p3.js', 'lesson-assessment-p3-u5.json', 'assessments-p3.html', 'lesson-assessment-p3-u5.html'}
          for n,b in files.items():pathlib.Path(n).write_bytes(base64.b64decode(b))
          d=json.loads(pathlib.Path('lesson-assessment-p3-u5.json').read_text());assert len(d)==198 and len({q['id']for q in d})==198
          assert [sum(q['lesson']==l for q in d)for l in range(1,5)]==[48,72,48,30]
          assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in frozen.items())
          p=pathlib.Path('sw.js');s=p.read_text();import re;s,n=re.subn(r'english-savant-v[0-9]+-[A-Za-z0-9-]+','english-savant-v74-p3u5',s);assert n>=1;p.write_text(s)
          PYCODE
          node --check lesson-assessment-p3.js
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add lesson-assessment-p3-u5.html lesson-assessment-p3-u5.json lesson-assessment-p3.js lesson-assessments-p3.html assessments-p3.html sw.js
          git commit -m "Publish source-attributed tested P3 Unit5 with grouped reading questions"
          git push origin HEAD:main
