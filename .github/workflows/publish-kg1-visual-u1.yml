name: Publish KG1 visual activities
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify and publish six visual activities without audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,lzma,base64,hashlib,pathlib,subprocess,urllib.request
          payload=b''.join(pathlib.Path('.github/workflows/kg1-u1-payload-'+str(i)+'.txt').read_bytes() for i in range(4))
          raw=lzma.decompress(base64.b64decode(payload))
          assert hashlib.sha256(raw).hexdigest()=='8708377089bcbae9c2aa1f6df88cffcdb56e50393cc3627cd403aa9e3ca306bc','Payload hash mismatch'
          p=json.loads(raw)
          assert set(p['files'])=={'kg1.html','index.html','sitemap.xml'}
          for name,old_hash in p['before'].items():
              path=pathlib.Path(name)
              assert (hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None)==old_hash,'Concurrent change: '+name
          for name,content in p['files'].items():
              data=content.encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==p['after'][name]
              pathlib.Path(name).write_bytes(data)
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+list(p['files']),check=True)
          subprocess.run(['git','commit','-m','Publish KG1 Unit 1 visual activities'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          repo=os.environ['GITHUB_REPOSITORY']
          req=urllib.request.Request('https://api.github.com/repos/'+repo+'/pages/builds',method='POST',data=b'{}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req) as response:print('Pages build request:',response.status,response.read().decode())
          print('Verified public files published:',len(p['files']))
          PY
