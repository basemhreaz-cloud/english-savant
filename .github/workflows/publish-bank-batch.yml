        run: |
          python3 - <<'PY'
          import os,json,gzip,base64,hashlib,pathlib,subprocess,re,urllib.request
          raw=gzip.decompress(base64.b64decode(''.join(os.environ['BANK_PAYLOAD_'+str(i)] for i in range(int(os.environ['BANK_PARTS'])))))
          assert hashlib.sha256(raw).hexdigest()==os.environ['BANK_DIGEST'],'Payload hash mismatch'
          p=json.loads(raw)
          assert len(p['files'])==28
          for name,old_hash in p['before'].items():
              assert re.fullmatch(r'[A-Za-z0-9_.-]+',name) and name.endswith(('.html','.js','.css','.json','.xml'))
              assert not any(s in name.lower() for s in ['adults','paid','private'])
              path=pathlib.Path(name)
              assert (hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None)==old_hash, 'Concurrent change: '+name
          for name,b64 in p['files'].items():
              data=base64.b64decode(b64)
              assert hashlib.sha256(data).hexdigest()==p['after'][name]
              pathlib.Path(name).write_bytes(data)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+list(p['files']),check=True)
          subprocess.run(['git','commit','-m','Publish verified P4 practice bank and mobile filter layout'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          repo=os.environ['GITHUB_REPOSITORY']
          req=urllib.request.Request('https://api.github.com/repos/'+repo+'/pages/builds',method='POST',data=b'{}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req) as response:
              print('Pages build request:',response.status,response.read().decode())
          print('Verified files published:',len(p['files']))
          PY
