name: Publish verified homepage footer repair
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply the verified single-file repair
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BEFORE: 3d1d15e39ed46f40eb57686e8cee39db992eb8d96c929ff5267dcb97c20dbed7
          EXPECTED_AFTER: e1cb726fe0690c25a4f3a182f46bd2e4c49715d6c5a3e52efecce1b8e71fad9d
        run: |
          python3 - <<'PY'
          import os,hashlib,pathlib,subprocess,urllib.request
          p=pathlib.Path('index.html')
          original=p.read_bytes()
          assert hashlib.sha256(original).hexdigest()==os.environ['EXPECTED_BEFORE'], 'Homepage changed since verification'
          end=original.rfind(b'</html>')
          assert end>0
          fixed=original[:end+7]+b'\n'
          assert hashlib.sha256(fixed).hexdigest()==os.environ['EXPECTED_AFTER'], 'Repair differs from verified file'
          p.write_bytes(fixed)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--','index.html'],check=True)
          subprocess.run(['git','commit','-m','Remove stray text below homepage footer'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          repo=os.environ['GITHUB_REPOSITORY']
          request=urllib.request.Request('https://api.github.com/repos/'+repo+'/pages/builds',method='POST',data=b'{}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(request) as response:
              print('Pages build request:',response.status,response.read().decode())
          print('Published one verified footer repair')
          PY
