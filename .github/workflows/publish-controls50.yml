name: Apply approved translation and controls
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed interface repair only
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,base64,zlib,json,re
          expected={'site-interface.js': 'dd6cd4c2c7be8789e25e34b158e8c0a083cdd1455ec21ed12f89eb5a3ec439a0', 'site-interface.css': 'b07a43072d721d8a9ac22dea19f6c05acf596b7f6815f833965d4d230bdcf749', 'site-search.js': '015c9f9e1316df10568b38a84e8dddbf4943899a3105bdf6a279136d1274378e', 'about.html': 'e34e4e369c1f84f4e022493a443cc97c8f6f54a2fc3d7e773be252437eb08f92'}
          for n,h in expected.items():assert hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h,n
          payload=json.loads(zlib.decompress(base64.b64decode('')))
          for n,b in payload.items():pathlib.Path(n).write_bytes(base64.b64decode(b))
          for p in pathlib.Path(".").glob("*.html"):
           s=p.read_text()
           for n in ["site-interface.js","site-interface.css","site-search.js"]:s=re.sub(re.escape(n)+r"\?v=[^\"\s>]+",n+"?v=20261123-release50",s)
           p.write_text(s)
          p=pathlib.Path("sw.js");s=p.read_text();assert "english-savant-v49-portrait" in s;p.write_text(s.replace("english-savant-v49-portrait","english-savant-v50-controls"))
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add "*.html" site-interface.js site-interface.css site-search.js sw.js
          git commit -m "Translate full About and repair shared controls"
          git push origin HEAD:main
