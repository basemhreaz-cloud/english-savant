name: Connect checked P1 Unit3 full lesson video
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate only six checked P1 Unit3 player files
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess,gzip
          files={'lessons.json': {'before': 'b63e04e22d5eea9150e25a603848b1e7d7476c419ce9615196fdbe7cab5bb061', 'after': '214b4158671bbe4d981f8ea52318f2fa5f27a1797b8beae25dc906128b7bd921', 'base64': ''}, 'grade-videos.js': {'before': '76be231313cd94cc466e27c8d8babe9cfd8a9652707fa54c72dc194ab601999b', 'after': 'a08ee7ab126f2cf1f4a585d6554e1fa6493e2b025e4d9620149e4175a53b2a9f', 'base64': ''}, 'watch.html': {'before': '04afa29cb0dde20c26f36c0b99f03c3530ba98c3a5c363d051b6fd8064efc30d', 'after': '6e06fbb6ac82840255adf926b64410f1f71a802a33f0213ed770803598a4fccc', 'base64': ''}, 'videos-p1.html': {'before': '36ed743ffc8603b89684b7ac57ab3af2aa22b80bed6a70b5577b519864b435e1', 'after': 'aa78c2059185fdbe063858aa741512ff500c2f6f2e9062184ae8be1372517c99', 'base64': ''}, 'explain-p1-u3.html': {'before': 'ca1b0047693d67a3f88672a64286f3c4ed188090a1a62161f720d2e1d893b6fd', 'after': '5ff92999340f1ba1c3a0bbc927ea396fad3aaf77b69f2c2dd629efcaafa2bd87', 'base64': ''}, 'videos/P1_U3_AR_full_word_lesson.jpg': {'before': None, 'after': '2680782d3b180d5b76c4fce8526a072cf38f60f97cd4b9a2846cd147ebe192ae', 'base64': ''}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(gzip.decompress(base64.b64decode(v['base64'])))==v['after'],n
          for n,v in files.items():pathlib.Path(n).write_bytes(gzip.decompress(base64.b64decode(v['base64'])))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Connect checked P1 Unit3 full lesson video'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
