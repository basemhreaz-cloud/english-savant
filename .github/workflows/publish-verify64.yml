name: Add source-checked P2 final-review verification
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded display corrections
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,re,base64,zlib
          frozen={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.suffix in ['.js','.json'] and str(p) not in ['sw.js','final-review-p2.js']}
          p=pathlib.Path('final-review-p2.js');assert hashlib.sha256(p.read_bytes()).hexdigest()=='e719c281f8fa39dad451dafeeedad2d80341b3cdca7fc815f9fdea001dc1e0be';p.write_bytes(zlib.decompress(base64.b64decode('')))
          p=pathlib.Path('site-interface.css');assert hashlib.sha256(p.read_bytes()).hexdigest()=='125e1f2ec9c0309b890c4da94bd9f4ae7b507ed1091861ee68955d464f825107';p.write_bytes(zlib.decompress(base64.b64decode('')))
          pathlib.Path('final-review-p2-answers.json').write_bytes(zlib.decompress(base64.b64decode('')))
          for p in pathlib.Path('.').glob('*.html'):
           if p.name.startswith('google'):continue
           s=p.read_text();s=re.sub(r'site-interface.css\?v=[^"\s>]+','site-interface.css?v=20261123-verify64',s)
           if p.name=='final-review-p2.html':s=s.replace('التدريب للمراجعة الذاتية، بدون تصحيح آلي.','تحقق من الإجابات الموثقة بعد الحل. الأسئلة التي لم يوثق مفتاحها بعد تحتاج مراجعة المدرس. / Verify source-checked answers after solving. Questions without a verified key need teacher review.');s=re.sub(r'final-review-p2.js\?v=[^"\s>]+','final-review-p2.js?v=20261123-verify64',s)
           p.write_text(s)
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v63-center' in s;p.write_text(s.replace('english-savant-v63-center','english-savant-v64-verify'))
          assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in frozen.items()),'other code/data changed'
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add '*.html' site-interface.css final-review-p2.js final-review-p2-answers.json sw.js
          git commit -m "Add verified objective review checks and teacher-review states"
          git push origin HEAD:main
