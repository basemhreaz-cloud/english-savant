name: Improve P2 word display and remove header contact
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded display corrections
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,re,base64,zlib
          frozen={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.suffix in ['.js','.json'] and str(p) not in ['sw.js','site-interface.js']}
          p=pathlib.Path('site-interface.js');assert hashlib.sha256(p.read_bytes()).hexdigest()=='4f14b4cdc60b49965b45f12171340e5619fb449ecfa89afb6280c5e13c1ff7f4';p.write_bytes(p.read_bytes()+zlib.decompress(base64.b64decode('')))
          p=pathlib.Path('site-interface.css');assert hashlib.sha256(p.read_bytes()).hexdigest()=='a9598eb7907edc53353aa836c7638e43a9b130d946932b7be301201267ae3f5b';p.write_bytes(p.read_bytes()+zlib.decompress(base64.b64decode('')))
          for p in pathlib.Path('.').glob('*.html'):
           if p.name.startswith('google'):continue
           s=p.read_text();s=re.sub(r'site-interface.(css|js)\?v=[^"\s>]+',lambda m:'site-interface.'+m.group(1)+'?v=20261123-word62',s);p.write_text(s)
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v61-fonts' in s;p.write_text(s.replace('english-savant-v61-fonts','english-savant-v62-word'))
          assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in frozen.items()),'code/data changed'
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          rm -f .github/workflows/.github/workflows/publish-word62.yml
          git add '*.html' site-interface.css site-interface.js sw.js .github/workflows/.github/workflows/publish-word62.yml
          git commit -m "Enlarge P2 incomplete words and remove header contact"
          git push origin HEAD:main
