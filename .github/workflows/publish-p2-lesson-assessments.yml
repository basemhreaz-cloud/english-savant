name: Publish reviewed P2 lesson assessments and unit exams
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate only reviewed P2 assessment files
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess,gzip
          files={'lesson-assessment-p2.js': {'before': None, 'after': 'b5f42fe9141d0f43c934f6db73d3ca53f9b57ba507d794f5b3fd84bd339a6417', 'base64': ''}, 'lesson-assessments-p2.html': {'before': None, 'after': '44ea34f8f708567c58079b046e11cba220316da69ccfacd0e7df539ff83de04b', 'base64': ''}, 'p2-unit-exam.js': {'before': None, 'after': '4602a0c58bef0f5ef60c35bbd187f3fcfaba77be4b92b9853a0d0a0f4fec4bba', 'base64': ''}, 'assessments-p2.html': {'before': '82a7759cf466571194b91cb20e9f53b10d808aafc8859e2fc7cac2ca9b4e8e76', 'after': '7fd2d590c358001e7987d173fad7ccf226a6b09f07a4ecc72a7f2e365ff3582c', 'base64': ''}, 'test-p2.html': {'before': '2839a96e957ac308b5af51f0098eea4aca7cad3f9baed51b09c22857c8af66a2', 'after': '1d0c7ca42ce8e691b49b2ac376aca38c89a30f9018002030fa9656585a58f7b4', 'base64': ''}, 'lesson-assessment-p2-u1.html': {'before': None, 'after': '85ceaa14a67c4c9f4be9378a6abc9c5974946dd123241825d854cf3781487e87', 'base64': ''}, 'lesson-assessment-p2-u1.json': {'before': None, 'after': 'e092d7dfe9f3decc6613fec728754cb370f6c11cadb14ed776e2741403446170', 'base64': ''}, 'test-p2-u1.html': {'before': None, 'after': '5627a36be04c3e700cb34f97e0046913f3e9483073ca132cb2888be489c1e18d', 'base64': ''}, 'p2-unit-exam-u1.json': {'before': None, 'after': '630ec54f54e1f45ebf12ee1ec4d641d633c3436a2c1a176b8b13e9b4a51b8168', 'base64': ''}, 'lesson-assessment-p2-u2.html': {'before': None, 'after': 'b6ef62c2f7a4909e990f5ba737647c6ab2271d2d606342c96c5d4bfef39b07e7', 'base64': ''}, 'lesson-assessment-p2-u2.json': {'before': None, 'after': '81671a6b8c155ba748047da3c120982ac2cf1266ed4dd5e97391e114a4d600f7', 'base64': ''}, 'test-p2-u2.html': {'before': None, 'after': '3adf8d41d7f099479c2aa37c153dbef804144cc6680d27d6304adefd72d25aed', 'base64': ''}, 'p2-unit-exam-u2.json': {'before': None, 'after': '18615f32c440c0a3cc1ebb615a5643d0cc86c221ecee8810151ca52b2bf76ce2', 'base64': ''}, 'lesson-assessment-p2-u3.html': {'before': None, 'after': '17bb3852f38b98f9aa40ffdc07894a1f1a450529c9e70437d2a77d