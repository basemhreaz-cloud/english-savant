name: Translate deep course UI and verify status copy
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 <<'PYCODE'
          import pathlib,hashlib,base64,gzip,subprocess,re
          f=pathlib.Path('site-interface.js');assert hashlib.sha256(f.read_bytes()).hexdigest()=='68e25d6281f5bccd71774009f84e2223356d60dbfeaa75065b791d050724b8ec'
          f.write_bytes(gzip.decompress(base64.b64decode('')))
          f=pathlib.Path('course-kg1.html');assert hashlib.sha256(f.read_bytes()).hexdigest()=='1384cd2a3c4eed8acf5cf501a721fbf2000d912344889360abc232cdc86514e6'
          f.write_bytes(gzip.decompress(base64.b64decode('')))
          f=pathlib.Path('resources.html');assert hashlib.sha256(f.read_bytes()).hexdigest()=='49340a4f940e200effd2c0e2b0c28383977f05f54a2035aa4e8c966952fe1bff'
          f.write_bytes(gzip.decompress(base64.b64decode('')))
          f=pathlib.Path('kg1.html');assert hashlib.sha256(f.read_bytes()).hexdigest()=='c462a675d88ab99ed14f0a8527df944856f08b1ac8acb5be40162c223a9942ef'
          s=f.read_text()
          assert s.count("if(ready&&unit.activities[activityIndex]?.kind==='look-listen-point')render(false);")==1;s=s.replace("if(ready&&unit.activities[activityIndex]?.kind==='look-listen-point')render(false);",'if(ready)render(false);')
          assert s.count("document.querySelector('.release-note').textContent=unit.activities.length+' أنشطة متاحة. صور الكلمات وأمثلة الحروف المتاحة بتبدأ بالعربي وبعده الإنجليزي. تدريب السماع متاح، وباقي الصوت والتدريبات لسه بتتجهز.';")==1;s=s.replace("document.querySelector('.release-note').textContent=unit.activities.length+' أنشطة متاحة. صور الكلمات وأمثلة الحروف المتاحة بتبدأ بالعربي وبعده الإنجليزي. تدريب السماع متاح، وباقي الصوت والتدريبات لسه بتتجهز.';",'document.querySelector(\'.release-note\').textContent=unit.activities.length+" أنشطة متاحة. صور الكلمات وأمثلة الحروف المتاحة بتبدأ بالعربي وبعده الإنجليزي، ومعاها تدريب اسمع واختار الصورة وأنشطة أصلية. بعض السرد الصوتي لسه بيتجهز. مفيش تقييم آلي للنطق أو الخط.";')
          f.write_text(s)
          changed=['site-interface.js', 'course-kg1.html', 'resources.html', 'kg1.html']
          for f in pathlib.Path('.').glob('*.html'):
           s=f.read_text();t=re.sub(r'site-interface\.js(?:\?v=[A-Za-z0-9_-]+)?', 'site-interface.js?v=20261123-depth18',s)
           if s!=t:f.write_text(t);changed.append(str(f))
          f=pathlib.Path('sw.js');s=f.read_text();t=s.replace('english-savant-v17-routes','english-savant-v18-depth');assert t!=s;f.write_text(t);changed.append('sw.js')
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',*changed],check=True)
          subprocess.run(['git','commit','-m','Translate course details and correct KG navigation and status copy'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
