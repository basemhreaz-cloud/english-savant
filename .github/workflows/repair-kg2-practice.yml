name: Repair separate KG2 practice listening games
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate only twelve checked KG2 practice files
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess,gzip
          files={'kg2-u1-practice.js': {'before': '2ea6ad6eada80135304bf32c1e0da17eb3d31faa4f0ee5c1e1f3f2bb79a5fb0d', 'after': '1fba5315d912eff00bc9ea220498ef024354e4b6feb43bcb2aa1180790fbb9c9', 'base64': ''}, 'kg2-u1-practice.css': {'before': '5c5cf88db275277478bd3d9b0817c10136388d5de2a473c29f1d60e8157c9ee5', 'after': 'de21c1fb333428b639e81e137ca90eedeed8fe2decbef43dbaa0e5850e77f9ac', 'base64': ''}, 'kg2-u1-practice.html': {'before': 'e1184a1372509b1334089dc5a7b31833032cc2de927cef37bffdaeebd35c9f25', 'after': 'd2145a2b3cf83e2cefd81357c9192afadd2bddd90cda0a3bf0cd8398be174c03', 'replace': [('20261122-u1practice1', '20261123-kgfix2'), ('20261122-u1practice1', '20261123-kgfix2')]}, 'kg2-u2-practice.js': {'before': 'c2b5bca773a9589f76c9072a3c598358b4c7453e7ee5ae73b5bb44ea0186d537', 'after': 'b9e1213be72fdfc11980c0649891894eb5cc3d66299aa3c1189ce66a48649335', 'base64': ''}, 'kg2-u2-practice.css': {'before': '23ea5b57ae577699d661f4645755838c13eaaff89ff0700f9db2242cae283892', 'after': 'dc7f862bf5d0a08683f9744135e48f3361d3fd8a660b810c5e49f239b5f84f2e', 'base64': ''}, 'kg2-u2-practice.html': {'before': 'f76b29e74675057dfc30eed47dc161ae565a5488d1ef51e44d429640639cbdc1', 'after': '969c9a964352564fcdadd9e449d5b90fedbd702bb706cdd2445dbdee00416ad4', 'replace': [('20261122-u2practice1', '20261123-kgfix2'), ('20261122-u2practice1', '20261123-kgfix2')]}, 'kg2-u3-practice.js': {'before': 'bacb1740fac9bb569a15ce121aa74a63d877b69590a00cd45de8b7a890b4413d', 'after': 'c33b4c6af0618646baaad41c85541122d58d0d8dd589d275363f304814925821', 'base64': ''}, 'kg2-u3-practice.css': {'before': '61736e28a370587581a02908c27ad3f59cb8770546fae3e56110f0616577170d', 'after': '9c49dd06a6f198ebf7bf3764870999fad2422fd67e2229fadc7ec436923d2646', 'base64': ''}, 'kg2-u3-practice.html': {'before': 'b6b264eaf0a9b0d4b391fc53438207acb74d3ad64867ccfbb4db77d23d57ce84', 'after': '3779c536d9a16b250a8f783a1f11a6f79a31221cf8488e5f6a6d27a5fc4212a9', 'replace': [('20261122-u3practice3', '20261123-kgfix2'), ('20261122-u3practice3', '20261123-kgfix2')]}, 'kg2-u4-practice.js': {'before': 'e00d5ea20a3062f4ed47d2cd0ff7c0bf14d76ad94e4f6694967b29fe65f4b9e5', 'after': '701769d5a407f72a29fa88b76cc7a6b167fe1a015a4026b1051d274f55e44531', 'base64': ''}, 'kg2-u4-practice.css': {'before': '6d6e25099960a759500d357636de4e8a57a344da367b51e3d10368086f64b41d', 'after': '0c1c9bfbab5f1e7b0808f2b20fe5f15f5de728241acb2bc2aa360b059c5a475f', 'base64': ''}, 'kg2-u4-practice.html': {'before': '98697e85da32722dfdf1909d34037c2401cc6107635908633f84c5d9ba581317', 'after': '493f8f4e2f3757f362134db83c554d14027d42830b061888747f8f3b03b8a740', 'replace': [('20261122-u4practice2', '20261123-kgfix2'), ('20261122-u4practice2', '20261123-kgfix2')]}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          def content(n,v):
            if 'base64' in v:return gzip.decompress(base64.b64decode(v['base64']))
            text=pathlib.Path(n).read_text()
            for old,new in v['replace']:text=text.replace(old,new)
            return text.encode()
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(content(n,v))==v['after'],n
          for n,v in files.items():pathlib.Path(n).write_bytes(content(n,v))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Repair separate KG2 practice listening games'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
