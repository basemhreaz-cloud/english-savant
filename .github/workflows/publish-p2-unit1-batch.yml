name: Publish reviewed P2 Unit 1 assessment batch
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish tested P2 lesson bank and entry links
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess,gzip
          files={'lesson-assessment-p2.js': {'before': '87cfb761ce83fd6717431dc4ebd5b648aa5fcb320b09ccc601e71de54fe470b0', 'after': '8bc5c0627c789212c24e056081c6c1d0fba2a7effd1b730dff239ea6633b602c', 'base64': ''}, 'lesson-assessment-p2-u1.json': {'before': '4bf55ca5284da70e4b642d4d9673692401399209083cd991182f7712ea7685ed', 'after': '080d20327eea7dd1fe221c2c9a835ca079370988c22a222640c301995f4df962', 'base64': ''}, 'lesson-assessment-p2-u1.html': {'before': '79b7490a762849ba934c808c9ac94e0bca8f729737edaa993dabbc99880818f4', 'after': '519ebeaf757b3b84deb5cbbb6321bde1f8c274f30d8ae62e3f7088175bed8608', 'base64': ''}, 'lesson-assessments-p2.html': {'before': 'c519b3e9042460f84877489d04ecaa3fba6d54862f15d39291e4874cd7f17d8b', 'after': '5a1b931bb745276fe5061202e72dd75b2d018dbf8756f08685c7d7352930ae76', 'base64': ''}, 'p2-lessons-assets/img/bag.png': {'before': None, 'after': '63cde433352229f2380d42ace4c360e519829ac435a6a69245df40e394af9ec2', 'base64': ''}, 'p2-lessons-assets/img/cap.png': {'before': None, 'after': '0447cc0fc7186135bc33938ab20db9af60472c0b3919f26da0208d41155e6d2c', 'base64': ''}, 'p2-lessons-assets/img/fig.png': {'before': None, 'after': '2518f7ab5583da24b27173466bace6cd3aa800b54076018daa36071e35ccbfe6', 'base64': ''}, 'p2-lessons-assets/img/min-bag.png': {'before': None, 'after': '947dd2f8a1bf95980a127e487bb1bec69cc96e8830a0104faac4ea6dd6022b7b', 'base64': ''}, 'p2-lessons-assets/img/min-board.png': {'before': None, 'after': '2ba8184c8ffe4cbb09ba4489d36aec10ef6d043c82ea5337c8a8771ef089d323', 'base64': ''}, 'p2-lessons-assets/img/min-door.png': {'before': None, 'after': '2d7cfac1840b71a060df6b1b229ab944357865a7411b4d0663d0a1437374b5c1', 'base64': ''}, 'p2-lessons-assets/img/min-eraser.png': {'before': None, 'after': '5c1872b362b7e9e8e79ffed142b04065caeeca03ae21e2adecbf688c15c4647a', 'base64': ''}, 'p2-lessons-assets/img/notebook.png': {'before': None, 'after': '3eff10bf09160ae08b573d82e920ea469b34eb9a57c187bf0ed5a4c17511ad56', 'base64': ''}, 'p2-lessons-assets/img/pencil-case.png': {'before': None, 'after': 'b73266b8eb472565c4cf57dcb0c28d7f13e740494585d3a0ad15276c0f928f40', 'base64': ''}, 'p2-lessons-assets/img/red-cap.png': {'before': None, 'after': '647028df9f2baae398eba609f2f00292f7d0dc1cc1baa5d386832d68f81b0e35', 'base64': ''}, 'p2-lessons-assets/img/ruler.png': {'before': None, 'after': 'a821c0b1a705cda588d5b36f98c0ead580ccc17d0406d8dc0d7005f66c48b166', 'base64': ''}, 'p2-lessons-assets/img/window.png': {'before': None, 'after': '10fd380b0eda0ea82c9cc834b8e8da3eee423da55ac753f255d70114c08a5200', 'base64': ''}, 'p2-lessons-assets/img/zip.png': {'before': None, 'after': '209eae1fdf704c29838534527220da4c987b89badef89d20145145f8975daebe', 'base64': ''}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(gzip.decompress(base64.b64decode(v['base64'])))==v['after'],n
          for n,v in files.items():
            p=pathlib.Path(n);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(gzip.decompress(base64.b64decode(v['base64'])))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Publish reviewed P2 Unit 1 assessment batch'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
