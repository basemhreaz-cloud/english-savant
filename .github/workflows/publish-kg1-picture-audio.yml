name: Publish KG1 checked Arabic-first picture audio
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Download exact private checked transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/releases > /tmp/releases.json
          python3 - <<'PY'
          import json,pathlib
          rows=[r for r in json.load(open('/tmp/releases.json')) if r['draft'] and r['name']=='KG1 checked picture audio transfer' and [a['id'] for a in r['assets']]==[779369756]]
          assert len(rows)==1,'Transfer mismatch'
          pathlib.Path('/tmp/draft-id').write_text(str(rows[0]['id']))
          PY
          gh api -H 'Accept: application/octet-stream' repos/$GITHUB_REPOSITORY/releases/assets/779369756 > /tmp/checked.zip
      - name: Verify and publish only checked activity files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,json,hashlib,subprocess,urllib.request,os,re
          b=pathlib.Path('/tmp/checked.zip').read_bytes()
          assert hashlib.sha256(b).hexdigest()=='03a148d35d773df564125728964099342f8b36cad5001eeddb7516a94ca351bf','Transfer integrity'
          with zipfile.ZipFile('/tmp/checked.zip') as z:
              p=json.loads(z.read('transfer.json')); names=set(p['files'])
              assert len(names)==96 and p['pairs']==47 and p['clips']==94 and set(z.namelist())==names|{'transfer.json'}
              for name,v in p['files'].items():
                  q=pathlib.PurePosixPath(name);assert not q.is_absolute() and '..' not in q.parts
                  assert name=='kg1.html' or (q.parent.as_posix()=='assets/kg1/picture-audio' and (q.name=='registry.json' or re.fullmatch(r'picture-(ar|en)-w-[a-z-]+\.mp3',q.name)))
                  f=pathlib.Path(name)
                  assert (hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else None)==v['before'],'Concurrent change: '+name
                  assert hashlib.sha256(z.read(name)).hexdigest()==v['after'],'File integrity: '+name
              for name in names:
                  f=pathlib.Path(name);f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(z.read(name))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(names),check=True)
          subprocess.run(['git','commit','-m','Publish checked KG1 Arabic-first picture audio'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY
      - name: Remove only the consumed private transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(cat /tmp/draft-id)
          gh api repos/$GITHUB_REPOSITORY/releases/$draft > /tmp/used-draft.json
          python3 -c "import json; p=json.load(open('/tmp/used-draft.json')); assert p['draft'] is True and p['name']=='KG1 checked picture audio transfer' and [a['id'] for a in p['assets']]==[779369756]"
          gh api --method DELETE repos/$GITHUB_REPOSITORY/releases/$draft
