name: Publish checked P3 Units1 and2 eligible lessons
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release checked lessons, preserve unavailable lesson gates
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,json,base64,zlib,re
          expected={'lesson-assessments-p3.html': '22a321e172613f56052e64c474934a1ece52fbdd567d4637cc35e47d699e055f', 'assessments-p3.html': 'd089e2e449f8a9f7a09a02e18cde0f93d2a84b74f641d224c783b48c558156c9', 'lesson-assessment-p3.js': '0c4fb9b232ad4dcd4df59e5f168c9a393498bdbad932b84399cda5b9c5920ec5', 'sw.js': 'ffe5789b99678d66543f32bb53a82767d710b77f438c329ed6ad9880b0c492ac'}
          for n,h in expected.items():assert hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h,n
          frozen={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('.').glob('*.json')}
          files=json.loads(zlib.decompress(base64.b64decode(''.join(pathlib.Path('.github/workflows/payload76-'+str(i)+'.txt').read_text().strip()for i in range(1)))))
          assert set(files)=={'lesson-assessment-p3-u1.json', 'lesson-assessment-p3-u1.html', 'lesson-assessment-p3.js', 'lesson-assessments-p3.html', 'lesson-assessment-p3-u2.json', 'assessments-p3.html', 'lesson-assessment-p3-u2.html'}
          for n,b in files.items():pathlib.Path(n).write_bytes(base64.b64decode(b))
          assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in frozen.items())
          assert [sum(q['lesson']==l for q in json.loads(pathlib.Path('lesson-assessment-p3-u1.json').read_text()))for l in range(1,5)]==[37,32,70,67]
          assert [sum(q['lesson']==l for q in json.loads(pathlib.Path('lesson-assessment-p3-u2.json').read_text()))for l in range(1,5)]==[58,31,0,0]
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v74-p3u5'in s;p.write_text(s.replace('english-savant-v74-p3u5','english-savant-v76-p3u12'))
          PYCODE
          node --check lesson-assessment-p3.js
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add lesson-assessment-p3-u1.* lesson-assessment-p3-u2.* lesson-assessment-p3.js lesson-assessments-p3.html assessments-p3.html sw.js
          git commit -m "Publish checked P3 U1 and U2 lessons that meet source and answer gates"
          git push origin HEAD:main
