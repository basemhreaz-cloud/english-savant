name: Finish checked P1 Unit5 interactive handwriting
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate only six checked P1 handwriting files
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess,gzip
          files={'p1-handwriting.js': {'before': '0799a0e6e5aa4c3ed1bbb7ddc8b45597511ccc3fbf412ca71bacbda85b01d35d', 'after': '6ba1b814c25cbebb3d9272c5e724fd83d3ff53252bf9e2d81302037964bc5f27', 'base64': ''}, 'explain-p1-u1.html': {'before': 'fd280579cdc3e036711302237bb9e01498bb4c0e87da02a7c69b44305f677962', 'after': 'edc78f9753b0dd72282edfb35ca4843c51f77e3ade43a79992a307151345bdaf', 'base64': ''}, 'explain-p1-u2.html': {'before': 'b25793f06970389b4a0a582227db7cd04f32283d0691254314ce46c5d103a95a', 'after': 'cf40aae4c2107930d89fbd3d92b5cb806b061d1ce6e581fa5f1619fd2b536b95', 'base64': ''}, 'explain-p1-u3.html': {'before': '1d01bf431777ce4b5e27674f4e56cc67ac4934ef92fd45214ed3043700cb609c', 'after': '3cd9e26295c47d62891826e9c565654e670891af71f9c3714ef8836c8bedcacb', 'base64': ''}, 'explain-p1-u4.html': {'before': '9990d1460c5e291710c30f7e19960b67ea70a54afeec6437df96208bd5647101', 'after': 'c692e442c78c800ff41181463df88ac008e785aac2fdb7913ad98b1accfe9904', 'base64': ''}, 'explain-p1-u5.html': {'before': 'aaa549c36b191259b9378914203d43f928531fd1bf58c3fdfb7e7ebe8b3fb331', 'after': '0830533cb0f53e8b097e70193bcd3a35c40e698f993a4dfdb40805084efb69aa', 'base64': ''}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(gzip.decompress(base64.b64decode(v['base64'])))==v['after'],n
          for n,v in files.items():pathlib.Path(n).write_bytes(gzip.decompress(base64.b64decode(v['base64'])))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Finish checked P1 Unit5 interactive handwriting'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
