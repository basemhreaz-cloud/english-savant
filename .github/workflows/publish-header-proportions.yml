name: Balance header proportions
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 <<'PYCODE'
          import pathlib,hashlib,gzip,base64,subprocess
          manifest={'site-interface.css': {'before': '2a46e26406672736cbe63d7ad7dd75dc57b5c1f010b25073bd692807b0103cab', 'after': '7d30272c9abe1cb4b748d33f9e33b7105e957a6343896bfea2d2948906f67c89'}, 'sw.js': {'before': '999e7239c85261133f03bb232565e5b1d1a4b4a3e40d5fbf2e89ccd640c86b46', 'after': '72f73d05307545928be98eaf354cdb24541cbc1f02c178da89a7d29ecafc64cf'}}
          payload={'site-interface.css': '', 'sw.js': ''}
          for n,v in manifest.items():
           assert hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==v['before'],n
          for n,v in manifest.items():
           b=gzip.decompress(base64.b64decode(payload[n]));assert hashlib.sha256(b).hexdigest()==v['after'];pathlib.Path(n).write_bytes(b)
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','site-interface.css','sw.js'],check=True)
          subprocess.run(['git','commit','-m','Balance normal header height and square island corners'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
