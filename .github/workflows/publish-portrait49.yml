name: Replace old homepage About portrait
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use only approved replacement portrait
        run: |
          python3 - <<'PYCODE'
          import pathlib,re,hashlib
          p=pathlib.Path("index.html");b=p.read_bytes();assert hashlib.sha256(b).hexdigest()=='b7b35cd707deeb98b9a3d40ed2684530c5c7596cbedb6722b5df76a41aefec6a'
          s=b.decode();s,n=re.subn(r'(<figure class="glass basem-portrait"><img[^>]*src=")[^"]+("[^>]*>)',r'\1basem-portrait.webp?v=20261123-new\2',s);assert n==1;p.write_text(s)
          p=pathlib.Path("sw.js");s=p.read_text();assert "english-savant-v48-about" in s;p.write_text(s.replace("english-savant-v48-about","english-savant-v49-portrait"))
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add index.html sw.js
          git commit -m "Replace old homepage About photo only"
          git push origin HEAD:main
