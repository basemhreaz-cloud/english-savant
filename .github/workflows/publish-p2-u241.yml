name: Repair P2 Unit2 final board spacing
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python -m pip install -q gdown
          gdown 1oVYKAzDkOxprBkRFVYDA9KMANGEIIBEC -O /tmp/u3aa
          gdown 1KqMOsfTlgEe1rPUBSFvbAqpNOKP9P1Is -O /tmp/u3ab
          gdown 1szy3d4wyrCBqeLjka4u7lIw3Lw4k3SaA -O /tmp/u3ac
          cat /tmp/u3aa /tmp/u3ab /tmp/u3ac > /tmp/U2.mp4
          echo '40ca2d912ab46365d4904ea8846f2127fe66c13e16a122595c357c31a83775f2  /tmp/U2.mp4' | sha256sum -c -
          mv /tmp/U2.mp4 videos/ES_P2_T1_U2.mp4
          python3 <<'PY'
          import pathlib,json
          p=pathlib.Path('lessons.json');d=json.loads(p.read_text());q=next(x for x in d['lessons']if x['id']=='p2-u2');assert q['mp4']=='videos/ES_P2_T1_U2.mp4';q['media_version']='40ca2d912ab4';p.write_text(json.dumps(d,ensure_ascii=False,indent=2))
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v40-p2-answerability'in s;p.write_text(s.replace('english-savant-v40-p2-answerability','english-savant-v41-p2-u2-video'))
          PY
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add videos/ES_P2_T1_U2.mp4 lessons.json sw.js
          git commit -m 'Repair P2 Unit2 final board spacings only'
          git push origin HEAD:main
