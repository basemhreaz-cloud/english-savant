name: Put all four assessment sections inside assessments
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 <<'PYCODE'
          import pathlib,hashlib,base64,gzip,subprocess,re
          import pathlib,re
          names=['p2','p3','p4','p5','p6','m1','m2','m3'];changed=[]
          for g in names:
           p=pathlib.Path('assessments-'+g+'.html');s=p.read_text();pattern=r'<section class="wrap"><p><a class="button"[^>]*href="extra-assessments-'+g+r'.html"[^>]*>.*?</a></p></section>';m=re.search(pattern,s,re.S);assert m
           ours='<a class="grade-entry" href="extra-assessments-'+g+'.html"><h2>تقييماتنا</h2><p>تدريبات تانية للمراجعة وتقوية فهمك.</p><span class="grade-entry-open">افتح التقييمات ←</span></a>'
           s=s[:m.start()]+s[m.end():];s,n=re.subn(r'(</section>)(?=</main>)',lambda m:ours+m[1],s,count=1);assert n==1;p.write_text(s);changed.append(str(p))
           p=pathlib.Path('grade-'+g+'.html');s=p.read_text();s,n=re.subn(r'<a class="grade-entry" href="(?:final-review-'+g+r'|lesson-assessments-p2).html">.*?</a>','',s,flags=re.S);assert n>=1;p.write_text(s);changed.append(str(p))
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v30-finalmap'in s;p.write_text(s.replace('english-savant-v30-finalmap','english-savant-v32-four'));changed.append('sw.js')
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',*changed],check=True)
          subprocess.run(['git','commit','-m','Put all four assessment sections inside assessments'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
