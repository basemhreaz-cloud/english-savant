name: Publish KG1 Unit 3 word lesson
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ES_PAYLOAD_0: 
      ES_PAYLOAD_1: 
      ES_PAYLOAD_2: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Download checked lesson media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/octet-stream' repos/$GITHUB_REPOSITORY/releases/assets/779032714 > /tmp/kg1-u3.mp4
      - name: Verify and publish the lesson
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,lzma,base64,hashlib,pathlib,subprocess,urllib.request
          raw=lzma.decompress(base64.b64decode(''.join(os.environ['ES_PAYLOAD_'+str(i)] for i in range(3))))
          assert hashlib.sha256(raw).hexdigest()=='25652303fac51e9ec96070ca802da35c2f53a14bd167492104356f0b5e882c64'
          p=json.loads(raw)
          expected={'grade-kg1.html','grades.html','videos/ES_KG1_T1_U3.jpg','videos/ES_KG1_T1_U3.mp4'}
          assert set(p['before'])==expected and set(p['after'])==expected
          for name,old in p['before'].items():
              f=pathlib.Path(name)
              assert (hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else None)==old,'Concurrent change: '+name
          files={name:value.encode() for name,value in p['text'].items()}
          files['videos/ES_KG1_T1_U3.jpg']=base64.b64decode(p['poster'])
          files['videos/ES_KG1_T1_U3.mp4']=pathlib.Path('/tmp/kg1-u3.mp4').read_bytes()
          assert set(files)==expected
          for name,data in files.items():assert hashlib.sha256(data).hexdigest()==p['after'][name],'Integrity mismatch: '+name
          for name,data in files.items():pathlib.Path(name).write_bytes(data)
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(expected),check=True)
          subprocess.run(['git','commit','-m','Publish KG1 Unit 3 word-based lesson video'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          repo=os.environ['GITHUB_REPOSITORY']
          req=urllib.request.Request('https://api.github.com/repos/'+repo+'/pages/builds',method='POST',data=b'{}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req) as r:print('Pages build requested:',r.status)
          PY
      - name: Remove unpublished media transfer draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/releases/454439997 --jq '{draft,name}' > /tmp/draft-check.json
          python3 -c "import json; p=json.load(open('/tmp/draft-check.json')); assert p['draft'] is True and p['name']=='KG1 U3 website media transfer'"
          gh api --method DELETE repos/$GITHUB_REPOSITORY/releases/454439997
