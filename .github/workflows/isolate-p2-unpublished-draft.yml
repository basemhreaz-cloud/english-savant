name: Preserve unpublished P2 draft and restore deployment files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve-and-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Guard exact draft and preserve before restoring
        run: |
          set -euo pipefail
          draft=68b50a330c98bfc2e3b6e1c317ef28294335ae09
          base=4ae6d7cd5840ddee6f2020b25560b76a7a62ca49
          test "$(git rev-parse "$draft^")" = "$base"
          test "$(git diff --name-only "$draft" HEAD | grep -v '^.github/workflows/isolate-p2-unpublished-draft.yml$' | wc -l)" = 0
          git push origin "$draft:refs/heads/preserved-p2-authored-draft-20261123"
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git revert --no-edit "$draft"
          test "$(git diff --name-only "$base" HEAD | grep -v '^.github/workflows/isolate-p2-unpublished-draft.yml$' | wc -l)" = 0
          git push origin HEAD:main
