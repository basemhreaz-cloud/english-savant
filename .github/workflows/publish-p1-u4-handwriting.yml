name: Finish checked P1 Unit4 interactive handwriting
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate only five checked P1 handwriting files
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess,gzip
          files={'p1-handwriting.js': {'before': '31050c448ecc7dac90e1c8ade82c0835dd8e4d294734fef275b741406e3beb19', 'after': '0799a0e6e5aa4c3ed1bbb7ddc8b45597511ccc3fbf412ca71bacbda85b01d35d', 'base64': ''}, 'explain-p1-u1.html': {'before': 'ddc4757ae02684a2653ea1e056a825a872cfbd3c2d6af8d41074dd18e3e33eec', 'after': 'fd280579cdc3e036711302237bb9e01498bb4c0e87da02a7c69b44305f677962', 'base64': ''}, 'explain-p1-u2.html': {'before': 'fbb165941a57420f78d00f5d18481ff2d769e1855067dca97fb6089ce3168b97', 'after': 'b25793f06970389b4a0a582227db7cd04f32283d0691254314ce46c5d103a95a', 'base64': ''}, 'explain-p1-u3.html': {'before': '5ff92999340f1ba1c3a0bbc927ea396fad3aaf77b69f2c2dd629efcaafa2bd87', 'after': '1d01bf431777ce4b5e27674f4e56cc67ac4934ef92fd45214ed3043700cb609c', 'base64': ''}, 'explain-p1-u4.html': {'before': 'f7ea8fd2600a59d3bf59a8bcaaa734ddefdc5812cbe29786eec81f9abdda32a6', 'after': '9990d1460c5e291710c30f7e19960b67ea70a54afeec6437df96208bd5647101', 'base64': ''}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(gzip.decompress(base64.b64decode(v['base64'])))==v['after'],n
          for n,v in files.items():pathlib.Path(n).write_bytes(gzip.decompress(base64.b64decode(v['base64'])))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Finish checked P1 Unit4 interactive handwriting'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
