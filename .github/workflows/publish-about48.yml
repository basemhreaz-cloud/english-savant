name: Publish approved About page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add approved portrait and exact About text
        run: |
          python3 - <<'PYCODE'
          import pathlib,base64,zlib,json,re
          payload=json.loads(zlib.decompress(base64.b64decode('')))
          for n,b in payload.items():pathlib.Path(n).write_bytes(base64.b64decode(b))
          for f in pathlib.Path(".").glob("*.html"):
           s=f.read_text()
           if "about.html" not in s:
            s=re.sub(r'(<a[^>]*href="tools.html"[^>]*>.*?</a>)',r'\1<a href="about.html">من نحن</a>',s,count=1,flags=re.S)
            s=s.replace('</small><a href="privacy.html">','</small><a href="about.html">من نحن</a><a href="privacy.html">',1)
            f.write_text(s)
          p=pathlib.Path("sw.js");s=p.read_text();assert "english-savant-v47-p2-lessons" in s;p.write_text(s.replace("english-savant-v47-p2-lessons","english-savant-v48-about"))
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add "*.html" about.css basem-portrait.webp sw.js
          git commit -m "Publish approved About page with replacement portrait"
          git push origin HEAD:main
