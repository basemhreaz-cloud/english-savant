name: Restore selected typography sitewide
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded font system
        run: |
          python3 -m pip install fonttools==4.65.0 brotli==1.2.0
          python3 - <<'PYCODE'
          import pathlib,hashlib,re,base64,zlib,urllib.request
          from fontTools.ttLib import TTFont
          frozen={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.suffix in ['.js','.json'] and str(p)!='sw.js'}
          pathlib.Path('fonts').mkdir(exist_ok=True)
          data=urllib.request.urlopen('https://fonts.gstatic.com/s/baloobhaijaan2/v21/zYXwKUwuEqdVGqM8tPDdAA_Y-_bMKo1EhQd2tWxo8TxPTaP4.ttf').read();assert hashlib.sha256(data).hexdigest()=='bacc9f83150aca7d09442973ad170ecc0a878001f4db40961fb5ba1e3f45c995';pathlib.Path('/tmp/font.ttf').write_bytes(data);f=TTFont('/tmp/font.ttf');f.flavor='woff2';f.save('fonts/baloo-bhaijaan-2-600.woff2')
          data=urllib.request.urlopen('https://fonts.gstatic.com/s/baloobhaijaan2/v21/zYXwKUwuEqdVGqM8tPDdAA_Y-_bMKo1EhQd2tWxo8Tx2TaP4.ttf').read();assert hashlib.sha256(data).hexdigest()=='4ac8501d9b5b4212e3fccc14047180ee896378ed0c8510130ad1f38fe7b6bf62';pathlib.Path('/tmp/font.ttf').write_bytes(data);f=TTFont('/tmp/font.ttf');f.flavor='woff2';f.save('fonts/baloo-bhaijaan-2-700.woff2')
          data=urllib.request.urlopen('https://fonts.gstatic.com/s/ibmplexsansarabic/v15/Qw3CZRtWPQCuHme67tEYUIx3Kh0PHR9N6bs6.ttf').read();assert hashlib.sha256(data).hexdigest()=='02609c5ef845ef511676c8badb24d1fc8b4aed3dc3b9d8bbdab22c14431b7c16';pathlib.Path('/tmp/font.ttf').write_bytes(data);f=TTFont('/tmp/font.ttf');f.flavor='woff2';f.save('fonts/es-ibm-plex-sans-arabic-400.woff2')
          data=urllib.request.urlopen('https://fonts.gstatic.com/s/ibmplexsansarabic/v15/Qw3NZRtWPQCuHme67tEYUIx3Kh0PHR9N6YPO_9CT.ttf').read();assert hashlib.sha256(data).hexdigest()=='1fe214ca7ff822ff8b73e5bb9584414bfc6c845e7ddab41f24ac4fce8e55a860';pathlib.Path('/tmp/font.ttf').write_bytes(data);f=TTFont('/tmp/font.ttf');f.flavor='woff2';f.save('fonts/es-ibm-plex-sans-arabic-500.woff2')
          data=urllib.request.urlopen('https://fonts.gstatic.com/s/ibmplexsansarabic/v15/Qw3NZRtWPQCuHme67tEYUIx3Kh0PHR9N6YPi-NCT.ttf').read();assert hashlib.sha256(data).hexdigest()=='9e8b030f3326946e481c874a2f751c1321cb0708cba81b79e6c3f9ffacc931df';pathlib.Path('/tmp/font.ttf').write_bytes(data);f=TTFont('/tmp/font.ttf');f.flavor='woff2';f.save('fonts/es-ibm-plex-sans-arabic-600.woff2')
          data=urllib.request.urlopen('https://fonts.gstatic.com/s/ibmplexsansarabic/v15/Qw3NZRtWPQCuHme67tEYUIx3Kh0PHR9N6YOG-dCT.ttf').read();assert hashlib.sha256(data).hexdigest()=='05616a64c5dca137a327b30b1fe7f4fcd1e16892a332e1665b49d52038858044';pathlib.Path('/tmp/font.ttf').write_bytes(data);f=TTFont('/tmp/font.ttf');f.flavor='woff2';f.save('fonts/es-ibm-plex-sans-arabic-700.woff2')
          data=urllib.request.urlopen('https://raw.githubusercontent.com/google/fonts/main/ofl/baloobhaijaan2/OFL.txt').read();assert hashlib.sha256(data).hexdigest()=='ad09b05dc8bc678c9daf7c4c5f7ef1f55e5726127f4330b2e98e40b9dffcb860';pathlib.Path('fonts/OFL-baloo.txt').write_bytes(data)
          data=urllib.request.urlopen('https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/OFL.txt').read();assert hashlib.sha256(data).hexdigest()=='7e6b2818edbd8f6a01ae80641cc8f16a51080d08fb4e532be3a0b6f74adb07da';pathlib.Path('fonts/OFL-ibm.txt').write_bytes(data)
          p=pathlib.Path('site-interface.css');assert hashlib.sha256(p.read_bytes()).hexdigest()=='541beebd50b3fe4298ac6f89c530ac768fb46990dd74ebba7b991da10c7145b0';p.write_bytes(p.read_bytes()+zlib.decompress(base64.b64decode('')))
          for p in pathlib.Path('.').glob('*.html'):
           if p.name.startswith('google'):continue
           s=p.read_text();s=re.sub(r'site-interface.css\?v=[^"\s>]+','site-interface.css?v=20261123-font61',s);p.write_text(s)
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v60-select' in s;p.write_text(s.replace('english-savant-v60-select','english-savant-v61-fonts'))
          assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in frozen.items()),'code/data changed'
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add '*.html' site-interface.css sw.js fonts
          git commit -m "Unify headings and body using selected fonts with local font assets"
          git push origin HEAD:main
