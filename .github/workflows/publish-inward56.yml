name: Moderate inward glass surfaces
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified navigation CSS only
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,re,base64,zlib
          p=pathlib.Path('site-interface.css')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='5ea301b44693618d9a4bf60d62fdb07f2c7874f533241837229fc575d304b277'
          frozen={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.suffix in ['.js','.json'] and str(p)!='sw.js'}
          p.write_bytes(zlib.decompress(base64.b64decode('')))
          for p in pathlib.Path('.').glob('*.html'):
           if p.name.startswith('google'):continue
           s=p.read_text();s=re.sub(r'site-interface.css\?v=[^"\s>]+','site-interface.css?v=20261123-inward56',s);p.write_text(s)
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v55-icons' in s;p.write_text(s.replace('english-savant-v55-icons','english-savant-v56-inward'))
          assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in frozen.items()),'code/data changed'
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add '*.html' site-interface.css sw.js
          git commit -m "Apply moderate inward glass depth without outward elevation"
          git push origin HEAD:main
