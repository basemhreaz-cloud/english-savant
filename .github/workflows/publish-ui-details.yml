name: Fix compact question labels and back directions
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 <<'PYCODE'
          import pathlib,hashlib,gzip,base64,subprocess
          manifest={'site-interface.js': {'before': 'c7804db4e97e4518bc7cda6a6f0a0d5001e53237dbd41ee6e59754360fcab758', 'after': '7ba757798190058da32344d0d99d15f32b0137de427632a62d74b5312d210c78'}, 'site-interface.css': {'before': '15a46c6027a7d01d6d55b7989c3edb9d070d40462091a3358f9e9330ac4da3cf', 'after': 'eefa812f6a769f50de470fb7876c76ca898abdf97bbc018013ac3661b7dfe2de'}}
          payload={'site-interface.js': '', 'site-interface.css': ''}
          for n,v in manifest.items():
           assert hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==v['before'],n
          for n,v in manifest.items():
           b=gzip.decompress(base64.b64decode(payload[n]));assert hashlib.sha256(b).hexdigest()==v['after'];pathlib.Path(n).write_bytes(b)
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','site-interface.css','site-interface.js'],check=True)
          subprocess.run(['git','commit','-m','Fix compact labels and semantic English back arrows'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
