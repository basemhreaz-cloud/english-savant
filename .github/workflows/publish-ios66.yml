name: Add iPhone home screen installation guidance
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add checked Safari installation steps
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,base64,zlib
          p=pathlib.Path('index.html');assert hashlib.sha256(p.read_bytes()).hexdigest()=='400d9b1af4dca2328d01210d0122e8e64239862cb75e1903431b339a85d7b169';p.write_bytes(zlib.decompress(base64.b64decode('')))
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v65-app' in s;p.write_text(s.replace('english-savant-v65-app','english-savant-v66-ios'))
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add index.html sw.js
          git commit -m "Add iPhone option with Safari home screen steps"
          git push origin HEAD:main
