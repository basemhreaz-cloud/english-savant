name: Enable cached free Achird speech with honest fallback
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guarded speech client only, preserve every answer bank
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,json,zlib,base64,re
          expected={'fx.js': 'cb9336ac9abca4b9ca93f33df611f86e5a6307cfbc666bee76e90c28a98a8eb4', 'grade-shell.js': 'adf54d1e3dce2fd06c045ade9f98a3e7d385175ca0051845a6b425157ef8a4c4', 'sw.js': 'd8e00e0382ecb2c37c25519b11c10d5d7cb09787a5ece65a62b99751f3b767c2', 'tools.html': 'fd1b26f8f5c1e5b4a0758621b3d89b871c2c54f8d64c67a5b072d0dc3a9a961c'}
          for n,h in expected.items():
           assert hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h,n
          frozen={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('.').glob('*.json')}
          files=json.loads(zlib.decompress(base64.b64decode(''.join(pathlib.Path('.github/workflows/'+('workflows/' if i==0 else '')+'payload73-'+str(i)+'.txt').read_text().strip() for i in range(2)))))
          assert set(files)=={'site-speech.js','fx.js','grade-shell.js','tools.html'}
          for n,b in files.items():pathlib.Path(n).write_bytes(base64.b64decode(b))
          for p in pathlib.Path('.').glob('*.html'):
           s=p.read_text();s=re.sub(r'fx\.js\?v=[^"\s>]+','fx.js?v=20261124-achird80',s);s=re.sub(r'grade-shell\.js(?:\?v=[^"\s>]+)?','grade-shell.js?v=20261124-achird80',s)
           if 'site-speech.js' not in s and ('fx.js' in s or 'grade-shell.js' in s or p.name=='tools.html'):
            marker=re.search(r'<script[^>]*src="(?:fx\.js|grade-shell\.js|data:)',s)
            if marker:s=s[:marker.start()]+'<script src="site-speech.js?v=20261124-achird80"></script>'+s[marker.start():]
            else:s=s.replace('</head>','<script src="site-speech.js?v=20261124-achird80"></script></head>')
           if s!=p.read_text():p.write_text(s)
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v79-p3u4video' in s;p.write_text(s.replace('english-savant-v79-p3u4video','english-savant-v80-achird-live'))
          assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in frozen.items())
          PYCODE
          node --check site-speech.js
          node --check fx.js
          node --check grade-shell.js
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add '*.html' site-speech.js fx.js grade-shell.js sw.js
          git commit -m "Route spoken explanations through capped cached Achird with explicit fallback"
          git push origin HEAD:main
