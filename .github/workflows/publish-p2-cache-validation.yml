name: Validate cached P2 banks
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 <<'PYCODE'
          import pathlib,base64,json,hashlib,subprocess
          guards={'lesson-assessment-p2.js': '0561979b5bc8df10adbac3bbd84c7b1687123b9b64b1801a97c4dd5b7bb9e683', 'lesson-assessment-p2-u1.html': 'e69522efde432e3fd1f266e544ebedf8abe85077bf42cb4a723c82e8b501e5de', 'lesson-assessment-p2-u2.html': 'a14bea25f51ec8886e3abff4f762d892a9e08c1df844fa5c85ad2cbbe76cd050', 'lesson-assessment-p2-u3.html': 'c5f7a5c4b21702557e4253a5ae10c85d9b33fbc760ad752d6aedcac19b0d3f6b', 'lesson-assessment-p2-u4.html': 'fbfcbc22d55ca64cddbb744c4f93200569805379f286c5a0b8a47af8c24a312c', 'lesson-assessment-p2-u5.html': '24f03e8e81a7168f3ea49deea50535269d5be08ab6ae58e37ef1d9e370986867', 'lesson-assessment-p2-u6.html': '1b3df2b4948fcdf2ede28cead3df2e0399cc0a7943f607e70bbd8163a8f96f3a', 'sw.js': 'df0d20dde6ea5bfe7fa23ec6b53747950a02dd9c9310b23f611ecedc7f8cd2d8', 'lesson-assessment-p2-u5.json': '1858c4f9d4d237a8becf8068c8328cd897deab223f02d7327185ef5a32cd466a', 'lesson-assessment-p2-u6.json': '65240de306bc6651e267166f35408782b6767b01440cbd875e265aa58a3e886e'}
          for n,h in guards.items():assert hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h,n
          files={'lesson-assessment-p2.js': '', 'lesson-assessment-p2-u1.html': '', 'lesson-assessment-p2-u2.html': '', 'lesson-assessment-p2-u3.html': '', 'lesson-assessment-p2-u4.html': '', 'lesson-assessment-p2-u5.html': '', 'lesson-assessment-p2-u6.html': '', 'sw.js': ''}
          for n,b in files.items():pathlib.Path(n).write_bytes(base64.b64decode(b))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',*files],check=True)
          subprocess.run(['git','commit','-m','Validate cached P2 banks online and retain visited offline fallback'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
