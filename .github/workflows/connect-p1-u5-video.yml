name: Connect checked P1 Unit5 full lesson video
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate only six checked P1 Unit5 player files
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess,gzip
          files={'lessons.json': {'before': 'cad7c6771ca5271600bd290e0ff43e1e2aaf7368f35526601afcaadaf8f0753a', 'after': 'fec2bba62b8bc74cbbdf588683c38e4ca244777595e40820e40b0d489bc5629d', 'base64': ''}, 'grade-videos.js': {'before': 'd56b5314b20f68ee334a4b5eaedcce6150283f9231723c21c774aff2cdd03db0', 'after': 'f72be6b62b98ea3d5a48cdbf8b44d130b79a4c340b265254e0e017cfb54f2fe8', 'base64': ''}, 'watch.html': {'before': '7d1847901e9b612a7018d126db789bd6bc8d49dd6c6f2d39b697d1484a4aa675', 'after': '6385313972ce584268ebc71b4870c8167741ad346953337b1bfcbeb404704765', 'base64': ''}, 'videos-p1.html': {'before': 'fd1ac696a0e74688b2b8e4e2680a668e57923ff665c8a87a82c746478ceaae49', 'after': 'f2ae0217af3b6d27c4e3a0bdf09860e9e6a71d0aa8e381db04b294dfa2b927a6', 'base64': ''}, 'explain-p1-u5.html': {'before': '13b96285ade7116dec5db9a0a8a3be633f690d4e13e6b6ff5a32ce2641ab7092', 'after': 'aaa549c36b191259b9378914203d43f928531fd1bf58c3fdfb7e7ebe8b3fb331', 'base64': ''}, 'videos/P1_U5_AR_full_word_lesson.jpg': {'before': None, 'after': 'f003a4d0bc8ceab4ec98dbd966dbe61480a078b15cd8fb50ae67b4e4c2476fa7', 'base64': ''}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(gzip.decompress(base64.b64decode(v['base64'])))==v['after'],n
          for n,v in files.items():pathlib.Path(n).write_bytes(gzip.decompress(base64.b64decode(v['base64'])))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Connect checked P1 Unit5 full lesson video'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
