name: Repair P2 Unit3 board answer overlap
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python -m pip install -q gdown
          gdown 1tCllL9DYYH6A98IgYRJHJT_JTYHyldWg -O /tmp/u3aa
          gdown 1Uc8lcGjEFcAYKYmPGKMiNkMJGSOUPGEE -O /tmp/u3ab
          cat /tmp/u3aa /tmp/u3ab > /tmp/U3.mp4
          echo 'fc2bfbd1d560c2433866deadc5b3725d243624c57941dc7e7c5872532817142a  /tmp/U3.mp4' | sha256sum -c -
          mv /tmp/U3.mp4 videos/ES_P2_T1_U3.mp4
          python3 <<'PY'
          import pathlib,json
          p=pathlib.Path('lessons.json');d=json.loads(p.read_text());q=next(x for x in d['lessons']if x['id']=='p2-u3-lesson');assert q['mp4']=='videos/ES_P2_T1_U3.mp4';q['media_version']='fc2bfbd1d560';p.write_text(json.dumps(d,ensure_ascii=False,indent=2))
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v37-p2-fixes'in s;p.write_text(s.replace('english-savant-v37-p2-fixes','english-savant-v38-p2-u3-video'))
          PY
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add videos/ES_P2_T1_U3.mp4 lessons.json sw.js
          git commit -m 'Repair P2 Unit3 board answer overlaps only'
          git push origin HEAD:main
