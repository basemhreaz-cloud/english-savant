name: Update English resources

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh data/resources.json from Telegram sources
        run: python3 scripts/update_resources.py
      - name: Commit if changed
        run: |
          git config user.name "english-savant-bot"
          git config user.email "english-savant-bot@users.noreply.github.com"
          git add data/resources.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Update English resources (auto)"
            git push
          fi
