name: Balance subtle inward glass styling
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 <<'PYCODE'
          import pathlib,hashlib,base64,gzip,subprocess,re
          f=pathlib.Path('site-interface.css');assert hashlib.sha256(f.read_bytes()).hexdigest()=='37dbd3b66a0a06155bc4ddb2ceab97655eaf9c955833b9f816d699150ad8e187'
          b=gzip.decompress(base64.b64decode(''));assert hashlib.sha256(b).hexdigest()=='7471153b2f989a6726ad2a28d78c2757f447c59de16bf72525ecf67ec3f4e5be';f.write_bytes(b)
          changed=['site-interface.css']
          for f in pathlib.Path('.').glob('*.html'):
           s=f.read_text();t=re.sub(r'site-interface\.(js|css)(?:\?v=[A-Za-z0-9_-]+)?',lambda m:'site-interface.'+m[1]+'?v=20261123-subtle25',s)
           if s!=t:f.write_text(t);changed.append(str(f))
          f=pathlib.Path('sw.js');s=f.read_text();t=s.replace('english-savant-v24-visible','english-savant-v25-subtle');assert t!=s;f.write_text(t);changed.append('sw.js')
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',*changed],check=True)
          subprocess.run(['git','commit','-m','Balance subtle inward glass styling'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
