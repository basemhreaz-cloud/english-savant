name: Fix long assessment section visibility
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 <<'PYCODE'
          import pathlib,hashlib,base64,gzip,subprocess,re
          f=pathlib.Path('site-interface.css');assert hashlib.sha256(f.read_bytes()).hexdigest()=='48712c0d0fd2f978bb021dd541e2185a3d21d2de761aa9a0c39bee9fdf0e21f6'
          b=gzip.decompress(base64.b64decode(''));assert hashlib.sha256(b).hexdigest()=='37dbd3b66a0a06155bc4ddb2ceab97655eaf9c955833b9f816d699150ad8e187';f.write_bytes(b)
          f=pathlib.Path('site-interface.js');assert hashlib.sha256(f.read_bytes()).hexdigest()=='149ba86465394137c1e8e9f6a0a8e566fa6e0d5dd50fdff37ae402aef04c8998'
          b=gzip.decompress(base64.b64decode(''));assert hashlib.sha256(b).hexdigest()=='7f4d344f5a9d17bb4f5bbe9043bd1ca88f9346db06100a94cb11be46de477bd6';f.write_bytes(b)
          changed=['site-interface.css','site-interface.js']
          for f in pathlib.Path('.').glob('*.html'):
           s=f.read_text();t=re.sub(r'site-interface\.(js|css)(?:\?v=[A-Za-z0-9_-]+)?',lambda m:'site-interface.'+m[1]+'?v=20261123-visible24',s)
           if s!=t:f.write_text(t);changed.append(str(f))
          f=pathlib.Path('sw.js');s=f.read_text();t=s.replace('english-savant-v23-dark','english-savant-v24-visible');assert t!=s;f.write_text(t);changed.append('sw.js')
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',*changed],check=True)
          subprocess.run(['git','commit','-m','Fix long assessment section visibility'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
