name: Publish checked Arabic KG2 Unit 2 video
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Recover exact private transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/releases > /tmp/releases.json
          python3 - <<'PY'
          import json,pathlib
          expected=[{'id': 779775475, 'name': 'kg2-u2-web-transfer.part01', 'sha256': '58b402b4d72f33321e172217890d8d47ba1ff1b29462f473f2419eb947374fdd', 'bytes': 20000000}, {'id': 779776922, 'name': 'kg2-u2-web-transfer.part02', 'sha256': 'cd6caeeb01573cf6b10eefda5183f14df614a1aa1723f33a48040e8643588b88', 'bytes': 20000000}, {'id': 779778292, 'name': 'kg2-u2-web-transfer.part03', 'sha256': '2e44d89b2bd3577441170faa2065ed1da010159f6afef20fae7fbf91b724bd88', 'bytes': 20000000}, {'id': 779783996, 'name': '4-kg2-u2-web-transfer.part04', 'sha256': '17ea3f693c9e362fa4b3386ce7bad16c5f32561ff7e07c827dcd025c9d7fe5c6', 'bytes': 17695220}]
          rows=[r for r in json.load(open('/tmp/releases.json')) if r['draft'] and r['name']=='KG2 U2 checked Arabic video transfer' and sorted(a['id'] for a in r['assets'])==sorted(a['id'] for a in expected)]
          assert len(rows)==1,'Private transfer mismatch'
          actual={a['id']:a for a in rows[0]['assets']}
          for a in expected:
              assert actual[a['id']]['name']==a['name'] and actual[a['id']]['size']==a['bytes']
          pathlib.Path('/tmp/draft-id').write_text(str(rows[0]['id']))
          pathlib.Path('/tmp/expected-assets.json').write_text(json.dumps(expected))
          PY
          python3 - <<'PY'
          import json,subprocess,pathlib,hashlib
          chunks=[]
          for a in json.load(open('/tmp/expected-assets.json')):
              b=subprocess.check_output(['gh','api','-H','Accept: application/octet-stream','repos/'+__import__('os').environ['GITHUB_REPOSITORY']+'/releases/assets/'+str(a['id'])])
              assert len(b)==a['bytes'] and hashlib.sha256(b).hexdigest()==a['sha256'],'Part integrity mismatch'
              chunks.append(b)
          b=b''.join(chunks)
          assert hashlib.sha256(b).hexdigest()=='e3f5143a313170e31958008ef87a54ef9f403ca5fd100a068ffcf354a1694cb3','Combined transfer mismatch'
          pathlib.Path('/tmp/checked.zip').write_bytes(b)
          PY
      - name: Publish only four checked files
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,json,hashlib,subprocess
          allowed={'lessons.json','course-kg2.html','videos/ES_KG2_T1_U2.mp4','videos/ES_KG2_T1_U2.jpg'}
          with zipfile.ZipFile('/tmp/checked.zip') as z:
              p=json.loads(z.read('transfer.json'));names=set(p['files'])
              assert names==allowed and set(z.namelist())==allowed|{'transfer.json'}
              assert p['media_sha256']=='52c0947d598533c038876d2eb2dcf7a836a59baf192abf784540668e9e79098a'
              for name,v in p['files'].items():
                  f=pathlib.Path(name);b=z.read(name)
                  assert (hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else None)==v['before'],'Concurrent change: '+name
                  assert hashlib.sha256(b).hexdigest()==v['after'] and len(b)==v['bytes'],'Payload integrity: '+name
                  assert len(b)<100*1024*1024
              old=json.loads(pathlib.Path('lessons.json').read_text());new=json.loads(z.read('lessons.json'))
              assert new['lessons'][:-1]==old['lessons'] and new['lessons'][-1]['id']=='kg2-t1-u2'
              for name in names:
                  f=pathlib.Path(name);f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(z.read(name))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(allowed),check=True)
          subprocess.run(['git','commit','-m','Publish corrected Arabic KG2 Unit 2 video'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY
      - name: Remove consumed private transfer only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(cat /tmp/draft-id)
          gh api repos/$GITHUB_REPOSITORY/releases/$draft > /tmp/used-draft.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/used-draft.json'))
          assert p['draft'] is True and p['name']=='KG2 U2 checked Arabic video transfer'
          assert sorted(a['id'] for a in p['assets'])==sorted([779775475, 779776922, 779778292, 779783996])
          PY
          gh api --method DELETE repos/$GITHUB_REPOSITORY/releases/$draft
