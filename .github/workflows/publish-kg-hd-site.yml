name: Publish checked KG2 HD site players
on:
  workflow_dispatch:
    inputs:
      asset_id:
        type: string
        required: true
      packet_sha256:
        type: string
        required: true
permissions:
  contents: write
  pages: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ASSET_ID: ${{ inputs.asset_id }}
      PACKET_SHA: ${{ inputs.packet_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Locate exact private checked player packet
        run: |
          gh api repos/$GITHUB_REPOSITORY/releases > /tmp/releases.json
          python3 <<'PY'
          import os,re,json,pathlib
          aid=os.environ['ASSET_ID']; h=os.environ['PACKET_SHA'];assert re.fullmatch('[0-9]+',aid) and re.fullmatch('[a-f0-9]{64}',h)
          rows=[r for r in json.load(open('/tmp/releases.json')) if r['draft'] and r['name']=='KG2 checked HD player transfer' and len(r['assets'])==1 and str(r['assets'][0]['id'])==aid]
          assert len(rows)==1,'Exact checked packet not found';assert rows[0]['assets'][0]['size']<8000000
          pathlib.Path('/tmp/draft-id').write_text(str(rows[0]['id']))
          PY
          gh api -H 'Accept: application/octet-stream' repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID > /tmp/checked.zip
      - name: Check exact file set, old media preservation and current source hashes
        run: |
          python3 <<'PY'
          import os,pathlib,zipfile,json,hashlib,subprocess,re
          raw=pathlib.Path('/tmp/checked.zip').read_bytes();assert hashlib.sha256(raw).hexdigest()==os.environ['PACKET_SHA']
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          allowed={'lessons.json','course-kg2.html','grade-videos.js','watch.html','videos/ES_KG2_T1_U3_HD.jpg','videos/ES_KG2_T1_U4_HD.jpg'}
          with zipfile.ZipFile('/tmp/checked.zip')as z:
            p=json.loads(z.read('transfer.json'));names=set(p['files']);assert names and names<=allowed and set(z.namelist())==names|{'transfer.json'} and len(z.namelist())==len(names)+1
            assert p['units'] in ([3],[4],[3,4])
            for name,v in p['files'].items():
              f=pathlib.Path(name);assert sha(f.read_bytes() if f.exists() else None)==v['before'],'Concurrent source change: '+name
              b=z.read(name);assert len(b)==v['bytes'] and len(b)<2000000 and sha(b)==v['after'],'Checked file integrity: '+name
            before=json.loads(pathlib.Path('lessons.json').read_text());after=json.loads(z.read('lessons.json'))
            assert {k:v for k,v in before.items() if k!='lessons'}=={k:v for k,v in after.items() if k!='lessons'}
            old={l['id']:l for l in before['lessons']};new={l['id']:l for l in after['lessons']};assert len(new)==len(after['lessons'])
            assert set(new)==set(old)|{'kg2-t1-u'+str(u) for u in p['units']}
            for key in old:assert new[key]==old[key],'Existing video changed: '+key
            versions={3:'f0d1bd3e2487',4:'a3bf06a73b98'}
            for u in p['units']:
              l=new['kg2-t1-u'+str(u)];assert l['grade']=='kg2' and l['soon'] is False and l['media_version']==versions[u]
              assert re.fullmatch(r'https://github\.com/basemhreaz-cloud/english-savant/releases/download/kg2-u'+str(u)+r'-hd-20261122/ES_KG2_T1_U'+str(u)+r'_HD\.mp4',l['mp4'])
              assert l['poster']=='videos/ES_KG2_T1_U'+str(u)+'_HD.jpg'
            for name in names:
              f=pathlib.Path(name);f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(z.read(name))
          subprocess.run(['node','--check','grade-videos.js'],check=True)
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(names),check=True)
          subprocess.run(['git','commit','-m','Publish checked Arabic KG2 HD lesson players'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY
      - name: Remove only consumed private player packet
        run: |
          draft=$(cat /tmp/draft-id)
          gh api repos/$GITHUB_REPOSITORY/releases/$draft > /tmp/used-draft.json
          python3 <<'PY'
          import json,os
          p=json.load(open('/tmp/used-draft.json'));assert p['draft'] and p['name']=='KG2 checked HD player transfer' and len(p['assets'])==1 and str(p['assets'][0]['id'])==os.environ['ASSET_ID']
          PY
          gh api --method DELETE repos/$GITHUB_REPOSITORY/releases/$draft
