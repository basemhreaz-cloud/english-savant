name: Add missing source context to five P1 lesson questions
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate two checked P1 lesson banks
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess,gzip
          files={'lesson-assessment-p1-u2.json': {'before': 'a9f192ecfd35411bf9472c4a01f18fa12e3429917c04dc0e699ca3aa2baf737e', 'after': '916693e54e55741998c2c5e2ed7f33def96f3464e1fae19cf705f9837082cbcb', 'base64': ''}, 'lesson-assessment-p1-u5.json': {'before': '131384157069f0486c47adc0cde67800cf66478b6aceb6f8ac59b6c2003dd31c', 'after': 'cef0735d05ac58db6b2642aecc31f93f254c669c488de138932ec2e31655b26e', 'base64': ''}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(gzip.decompress(base64.b64decode(v['base64'])))==v['after'],n
          for n,v in files.items():pathlib.Path(n).write_bytes(gzip.decompress(base64.b64decode(v['base64'])))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Add missing source context to five P1 lesson questions'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
