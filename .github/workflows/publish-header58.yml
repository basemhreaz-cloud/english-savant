name: Fix sticky hover header centering
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded interface additions
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,re,base64,zlib
          frozen={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.suffix in ['.js','.json'] and str(p) not in ['sw.js','site-interface.js']}
          p=pathlib.Path('site-interface.css');assert hashlib.sha256(p.read_bytes()).hexdigest()=='ca8bc0c11c010ceba3e9d56de6c210a34537a7dbb2c085562e574da68ad849f2';p.write_bytes(p.read_bytes()+zlib.decompress(base64.b64decode('eJylkbtqw0AQRXt/xbgwOCIrpUmjwqW/wRBcDLsj7ZB9mNlZ2SHk32MppEnnqJkXnMuB6Ro48o0cWLyUGqhArEVBSJETqCcWmJiulywKlpKScBrB1aUVZfv+AZqr9eDzRNJC0228xtBLzrqUN4eKhmd0QEsmYBorjnSG1hM6ElNCVjj8rs8r+X4RWZ2CVnmiB2KomMiJDZf70f0bfFj/D/7j/amCqQxZYr9MAZVOe/P6snvacpy/iUm/Nt/RY7xZ')))
          for p in pathlib.Path('.').glob('*.html'):
           if p.name.startswith('google'):continue
           s=p.read_text();s=re.sub(r'site-interface\.(css)\?v=[^"\s>]+',r'site-interface.\1?v=20261123-header58',s);p.write_text(s)
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v56-inward' in s;p.write_text(s.replace('english-savant-v56-inward','english-savant-v58-header'))
          assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in frozen.items()),'educational code/data changed'
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add '*.html' site-interface.js site-interface.css sw.js
          git commit -m "Preserve fixed header centering during sticky touch hover"
          git push origin HEAD:main
