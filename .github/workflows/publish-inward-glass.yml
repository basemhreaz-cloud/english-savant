name: Inward glass and mirrored interface flow
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 <<'PYCODE'
          import pathlib,hashlib,base64,gzip,subprocess
          f=pathlib.Path('site-interface.css');assert hashlib.sha256(f.read_bytes()).hexdigest()=='6791d88e05f6c38b5b03c4a19adb2f74f0fdd3a4d6db89000ea8297c1121e614'
          f.write_bytes(gzip.decompress(base64.b64decode('')))
          changed=['site-interface.css']
          for f in pathlib.Path('.').glob('*.html'):
           s=f.read_text();t=s.replace('site-interface.css?v=20261123-card11','site-interface.css?v=20261123-glass12')
           if s!=t:f.write_text(t);changed.append(str(f))
          f=pathlib.Path('sw.js');s=f.read_text();t=s.replace('english-savant-v11-cards','english-savant-v12-glass');assert t!=s;f.write_text(t);changed.append('sw.js')
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',*changed],check=True)
          subprocess.run(['git','commit','-m','Apply requested inward glass surfaces and shared mirrored flow'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
