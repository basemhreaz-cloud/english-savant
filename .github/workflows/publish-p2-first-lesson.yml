name: Publish reviewed P2 first lesson assessment
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish tested P2 lesson bank and entry links
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess,gzip
          files={'lesson-assessment-p2.js': {'before': None, 'after': '87cfb761ce83fd6717431dc4ebd5b648aa5fcb320b09ccc601e71de54fe470b0', 'base64': ''}, 'lesson-assessment-p2-u1.json': {'before': None, 'after': '4bf55ca5284da70e4b642d4d9673692401399209083cd991182f7712ea7685ed', 'base64': ''}, 'lesson-assessment-p2-u1.html': {'before': None, 'after': '79b7490a762849ba934c808c9ac94e0bca8f729737edaa993dabbc99880818f4', 'base64': ''}, 'lesson-assessments-p2.html': {'before': None, 'after': 'c519b3e9042460f84877489d04ecaa3fba6d54862f15d39291e4874cd7f17d8b', 'base64': ''}, 'grade-p2.html': {'before': '606e62622b4432569249f1a9dd7f4b3e403ab40b412e7e1af86568a13acaa71e', 'after': 'dd93283354680766772de9863d4d14c73c104c0a1fe36e2941e81756ebdd0c47', 'base64': ''}, 'p2-lessons-assets/img/hello.png': {'before': None, 'after': '695719801c0600b82330cd35e86420bb1df1a3658e676899a75bc05c087b1e21', 'base64': ''}, 'p2-lessons-assets/img/salma.png': {'before': None, 'after': '6c3c2d8b8baf893352f2bb7bb9c0c40563cadc26295ffc758625fff0f4a666dc', 'base64': ''}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(gzip.decompress(base64.b64decode(v['base64'])))==v['after'],n
          for n,v in files.items():
            p=pathlib.Path(n);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(gzip.decompress(base64.b64decode(v['base64'])))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Publish reviewed P2 first lesson assessment'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
