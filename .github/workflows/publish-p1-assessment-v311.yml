name: Publish reviewed P1 lesson assessment correction
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate only seven reviewed assessment data files
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess,gzip
          files={'lesson-assessment-p1-u1.json': {'before': '8f274d48f1f050e4624d9e3d9fa97f89831d32d1b3464af2b033d0edf2a088af', 'after': 'f6d6b41b051c9da2d0c3266a2de44e62c1d73d3ec49e4ece12076586db2f8b51', 'base64': ''}, 'lesson-assessment-p1-u2.json': {'before': 'bdd8f18fa890be80573cb2adc7e1b08e09a6293e2a4c361f305dbed3690113bf', 'after': 'a9f192ecfd35411bf9472c4a01f18fa12e3429917c04dc0e699ca3aa2baf737e', 'base64': ''}, 'lesson-assessment-p1-u3.json': {'before': '5c4b97f5c64c8c624dd31a3b38add362430cf0aefafe3a6c5e0797b6279a01d6', 'after': '984b3faed3e31ee0dfa67e2c03e8449331f9294df08ba96040ba0387ddc0d512', 'base64': ''}, 'lesson-assessment-p1-u4.json': {'before': 'ae7c874c6e4e76aa6c7117afc1c24cb846a42c8dc7102acf6a3f4156c8fc6f51', 'after': '3cf94be098498d9517bf2779436c615c5c3541d3dff0255c817d5ef9f23216bd', 'base64': ''}, 'lesson-assessment-p1-u5.json': {'before': '8ceb5d980fd779a7fec12047f9bff50bd30eeaed2b24b475f45291543472bd7e', 'after': '35049cae1b27ec140e420fa4033622ef01ed75ac2fb0d0151da911f8465651fb', 'base64': ''}, 'lesson-assessment-p1-u6.json': {'before': 'd3b61daf4f4c13c79aca370bf7a70bba3055c382e7aa5a90513e5847044bd599', 'after': 'eed9f5318ee2a3850dab0a5470809ac57da609b782719e201f9c54f48d8a95e6', 'base64': ''}, 'p1-unit-exam-u3.json': {'before': '55af8681009aa0d1f3765072afa25524c0f24ad1bfeb7b0048bb26892807d2e3', 'after': 'fa21bb23ccd39699968b987e1cfde2382fbad569d0216629c0a0b39e910f9b13', 'base64': ''}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(gzip.decompress(base64.b64decode(v['base64'])))==v['after'],n
          for n,v in files.items():pathlib.Path(n).write_bytes(gzip.decompress(base64.b64decode(v['base64'])))
          assert sum(len(__import__('json').loads(pathlib.Path('lesson-assessment-p1-u'+str(u)+'.json').read_text()))for u in range(1,7))==1176
          assert len(__import__('json').loads(pathlib.Path('p1-unit-exam-u3.json').read_text()))==37
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Expand reviewed P1 lesson conversations and correct numeral scope'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
