name: Publish checked P1 teaching additions
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify and publish P1 teaching and practice
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,lzma,base64,hashlib,pathlib,subprocess,urllib.request
          raw=lzma.decompress(base64.b64decode(pathlib.Path('.github/workflows/.github/workflows/p1-teaching-release-payload.txt').read_bytes()))
          assert hashlib.sha256(raw).hexdigest()=='c0ec07e9e465a30d915d6569d7d94317404ff733c9061bd5857f2994d6a14654'
          p=json.loads(raw)
          expected={'unit-p1-u6-s4.html', 'explain-p1-u2.html', 'unit-p1-u1-s6.html', 'assess-p1-u2.html', 'explain-p1-u4.html', 'unit-p1-u1-s2.html', 'unit-p1-u6-s3.html', 'assess-p1-u6.html', 'unit-p1-u6-s2.html', 'unit-p1-u5-s2.html', 'unit-p1-u1-s5.html', 'unit-p1-u3-s3.html', 'unit-p1-u3-s4.html', 'course-p1.html', 'unit-p1-u2-s3.html', 'assess-p1-r2.html', 'unit-p1-u1-s3.html', 'unit-p1-u4-s4.html', 'assess-p1.json', 'unit-p1-u3.html', 'sitemap.xml', 'assess-p1-u4.html', 'unit-p1-u5-s3.html', 'teach-p1-u5.html', 'teach-p1-r1.html', 'assess-p1-u5.html', 'assess-p1-r1.html', 'unit-p1-u4.html', 'explain-p1-u3.html', 'teach-p1-u1.html', 'assess-p1-gr2.html', 'assess-p1-gr3.html', 'unit-p1-u4-s2.html', 'explain-p1-u1.html', 'explain-p1-r1.html', 'unit-p1-u2-s2.html', 'curr-p1.json', 'explain-p1-u6.html', 'unit-p1-r1.html', 'unit-p1-u2.html', 'unit-p1-u6.html', 'teach-p1-r2.html', 'teach-p1-u6.html', 'unit-p1-u1.html', 'teach-p1-u3.html', 'unit-p1-u4-s3.html', 'unit-p1-u1-s4.html', 'explain-p1-u5.html', 'unit-p1-u3-s2.html', 'unit-p1-u5-s4.html', 'assess-p1-gr1.html', 'unit-p1-u5.html', 'unit-p1-u2-s4.html', 'assess-p1-u3.html', 'teach-p1-u4.html', 'teach-p1-u2.html', 'unit-p1-r2.html', 'explain-p1-r2.html', 'assess-p1-u1.html', 'assess-p1-final.html'}
          assert {x['path'] for x in p['files']}==expected and len(p['files'])==len(expected)
          for item in p['files']:
              f=pathlib.Path(item['path'])
              assert (hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else None)==item['before'],'Concurrent change: '+str(f)
              assert hashlib.sha256(item['text'].encode()).hexdigest()==item['after']
          for item in p['files']:pathlib.Path(item['path']).write_bytes(item['text'].encode())
          for name in ['curr-p1.json','assess-p1.json']:json.loads(pathlib.Path(name).read_text())
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          payload_path='.github/workflows/.github/workflows/p1-teaching-release-payload.txt'
          pathlib.Path(payload_path).unlink()
          subprocess.run(['git','add','--']+sorted(expected)+[payload_path],check=True)
          subprocess.run(['git','commit','-m','Expand P1 teaching, dialogs and supplementary practice'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          repo=os.environ['GITHUB_REPOSITORY']
          req=urllib.request.Request('https://api.github.com/repos/'+repo+'/pages/builds',method='POST',data=b'{}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req) as r:print('Pages build requested:',r.status)
          print('Published checked P1 files:',len(expected))
          PY
