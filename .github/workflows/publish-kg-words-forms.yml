name: Publish checked KG word audio and trace additions
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Download exact private checked transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/releases > /tmp/releases.json
          python3 - <<'PY'
          import json,pathlib
          rows=[r for r in json.load(open('/tmp/releases.json')) if r['draft'] and r['name']=='KG checked words and forms transfer' and [a['id'] for a in r['assets']]==[779600008]]
          assert len(rows)==1,'Transfer mismatch'
          pathlib.Path('/tmp/draft-id').write_text(str(rows[0]['id']))
          PY
          gh api -H 'Accept: application/octet-stream' repos/$GITHUB_REPOSITORY/releases/assets/779600008 > /tmp/checked.zip
      - name: Verify and publish only checked activity files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,json,hashlib,subprocess,urllib.request,os
          b=pathlib.Path('/tmp/checked.zip').read_bytes()
          assert hashlib.sha256(b).hexdigest()=='9f224a6b2e031f6166daa85d1e80d5fcd132c41f603d4bd4f05eba4f31230f36','Transfer integrity'
          with zipfile.ZipFile('/tmp/checked.zip') as z:
              p=json.loads(z.read('transfer.json')); names=set(p['files'])
              assert len(names)==118 and p['kg1_new_practice']==4 and p['kg1_letter_pairs']==37 and p['kg1_new_clips']==72 and p['kg2_new_pairs']==11 and p['kg2_new_clips']==22 and p['new_trace_forms']==['G','4','10'] and set(z.namelist())==names|{'transfer.json'}
              for name,v in p['files'].items():
                  q=pathlib.PurePosixPath(name);assert not q.is_absolute() and '..' not in q.parts
                  assert hashlib.sha256('\n'.join(sorted(names)).encode()).hexdigest()=='25df5e822b5d23f9d74e1027bf2fc1f6d7bebf26fcc9f2df97d7562c285f56f4'
                  f=pathlib.Path(name)
                  assert (hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else None)==v['before'],'Concurrent change: '+name
                  assert hashlib.sha256(z.read(name)).hexdigest()==v['after'],'File integrity: '+name
              for name in names:
                  f=pathlib.Path(name);f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(z.read(name))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(names),check=True)
          subprocess.run(['git','commit','-m','Publish checked KG1 letter audio and practice with KG2 words and trace forms'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY
      - name: Remove only the consumed private transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(cat /tmp/draft-id)
          gh api repos/$GITHUB_REPOSITORY/releases/$draft > /tmp/used-draft.json
          python3 -c "import json; p=json.load(open('/tmp/used-draft.json')); assert p['draft'] is True and p['name']=='KG checked words and forms transfer' and [a['id'] for a in p['assets']]==[779600008]"
          gh api --method DELETE repos/$GITHUB_REPOSITORY/releases/$draft

