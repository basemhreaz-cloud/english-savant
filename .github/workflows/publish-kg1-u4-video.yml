name: Publish KG1 Unit 4 checked word lesson
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ES_PAYLOAD_0: 
      ES_PAYLOAD_1: 
      ES_PAYLOAD_2: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Check and download the exact private transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/releases > /tmp/releases.json
          python3 - <<'PY'
          import json,pathlib
          rows=[r for r in json.load(open('/tmp/releases.json')) if r['draft'] and r['name']=='KG1 U4 checked website transfer' and [a['id'] for a in r['assets']]==[779138005]]
          assert len(rows)==1,'Transfer draft mismatch'
          pathlib.Path('/tmp/draft-id').write_text(str(rows[0]['id']))
          PY
          gh api -H 'Accept: application/octet-stream' repos/$GITHUB_REPOSITORY/releases/assets/779138005 > /tmp/kg1-u4.mp4
      - name: Verify and publish exact checked files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,lzma,base64,hashlib,pathlib,subprocess,urllib.request
          raw=lzma.decompress(base64.b64decode(''.join(os.environ['ES_PAYLOAD_'+str(i)] for i in range(3))))
          assert hashlib.sha256(raw).hexdigest()=='020a6b0f98a7f21620cc661ef6483e7426747edef77515ae532c9ca605252ff7'
          p=json.loads(raw)
          expected={'lessons.json','course-kg1.html','grades.html','kg-nav-bridge.js','grade-kg1.html','grade-kg2.html','videos/ES_KG1_T1_U4.mp4','videos/ES_KG1_T1_U4.jpg'}
          assert set(p['before'])==expected and set(p['after'])==expected
          for name,old in p['before'].items():
              f=pathlib.Path(name)
              assert (hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else None)==old,'Concurrent change: '+name
          files={k:v.encode() for k,v in p['text'].items()}
          files['videos/ES_KG1_T1_U4.jpg']=base64.b64decode(p['poster'])
          files['videos/ES_KG1_T1_U4.mp4']=pathlib.Path('/tmp/kg1-u4.mp4').read_bytes()
          assert set(files)==expected
          for name,data in files.items():assert hashlib.sha256(data).hexdigest()==p['after'][name],'Integrity mismatch: '+name
          for name,data in files.items():pathlib.Path(name).write_bytes(data)
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(expected),check=True)
          subprocess.run(['git','commit','-m','Publish KG1 Unit 4 video and finish KG breadcrumb navigation'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/pages/builds',method='POST',data=b'{}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req) as r:print('Pages build requested:',r.status)
          PY
      - name: Delete only the consumed private transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(cat /tmp/draft-id)
          gh api repos/$GITHUB_REPOSITORY/releases/$draft > /tmp/u4-draft-final.json
          python3 -c "import json; p=json.load(open('/tmp/u4-draft-final.json')); assert p['draft'] is True and p['name']=='KG1 U4 checked website transfer' and [a['id'] for a in p['assets']]==[779138005]"
          gh api --method DELETE repos/$GITHUB_REPOSITORY/releases/$draft
