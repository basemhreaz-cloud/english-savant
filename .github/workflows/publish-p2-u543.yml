name: Repair P2 Unit5 independent practice cue
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python -m pip install -q gdown
          gdown 1ywiYxBI8jGZ-yUOupT35l6iGG-bxHZaI -O /tmp/U5.mp4
          echo '3116452434cdf118d7b541ee9e0f6d5550fa61c417201e2d5d1701f64a9b853f  /tmp/U5.mp4' | sha256sum -c -
          mv /tmp/U5.mp4 videos/ES_P2_T1_U5.mp4
          python3 <<'PY'
          import pathlib,json
          p=pathlib.Path('lessons.json');d=json.loads(p.read_text());q=next(x for x in d['lessons']if x['id']=='p2-u5-lesson');assert q['mp4']=='videos/ES_P2_T1_U5.mp4';q['media_version']='3116452434cd';p.write_text(json.dumps(d,ensure_ascii=False,indent=2))
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v42-p2-u4-video'in s;p.write_text(s.replace('english-savant-v42-p2-u4-video','english-savant-v43-p2-u5-video'))
          PY
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add videos/ES_P2_T1_U5.mp4 lessons.json sw.js
          git commit -m 'Repair P2 Unit5 independent practice cues only'
          git push origin HEAD:main
