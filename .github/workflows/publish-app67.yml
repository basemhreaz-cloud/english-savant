name: Publish Android v1.1.0 download
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish guarded APK update
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,base64,zlib
          frozen={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and str(p) not in ['index.html','sw.js','English-Savant-1.1.0.apk']}
          data=''.join(pathlib.Path('.github/workflows/apk67-'+str(i)+'.txt').read_text().strip() for i in range(2));apk=zlib.decompress(base64.b64decode(data));assert len(apk)==209474;assert hashlib.sha256(apk).hexdigest()=='53b0561b6c57c9bb8b9f15a9c4d8808eb624963468c1e4d7ac19a67f9192cefc';pathlib.Path('English-Savant-1.1.0.apk').write_bytes(apk)
          p=pathlib.Path('index.html');assert hashlib.sha256(p.read_bytes()).hexdigest()=='25e231385af9134925725704934494da92a4ba06d7b30e327147b214f333e95f';s=p.read_text();assert s.count('English-Savant-1.0.0.apk')==2;assert s.count('إصدار 1.0.0 · حوالي 200 كيلوبايت')==1;s=s.replace('English-Savant-1.0.0.apk','English-Savant-1.1.0.apk').replace('إصدار 1.0.0 · حوالي 200 كيلوبايت','إصدار 1.1.0 · حوالي 205 كيلوبايت');p.write_text(s)
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v66-ios' in s;p.write_text(s.replace('english-savant-v66-ios','english-savant-v67-app'))
          assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in frozen.items()),'unrelated file changed'
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add index.html English-Savant-1.1.0.apk sw.js
          git commit -m "Update Android download to v1.1.0 keeping rollback APK"
          git push origin HEAD:main
