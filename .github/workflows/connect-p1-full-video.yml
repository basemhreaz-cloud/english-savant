name: Connect checked P1 full lesson player
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Validate and connect only six checked P1 player files
        run: |
          python3 <<'PYCODE'
          import base64,hashlib,zipfile,io,pathlib,json,subprocess
          raw=base64.b64decode('')
          assert hashlib.sha256(raw).hexdigest()=='524ad858520d077696fc6b38ddd6c97cf8cae1b45ae4be59580cd96ce68ffaa3'
          expected={'lessons.json': {'before': '551ff23870a0a6d2a1b9b5f847c9b26c9a82f1c155021117942437b0c2b346f8', 'after': '0ec5edfa7c49066d950eb911288028265a94fa355962d3b914822d9134ea865d'}, 'grade-videos.js': {'before': 'ed4800fe15a62c3195a71e6eea453c1b2257a89acdd2c7f78427a730b29aa46d', 'after': '9784ed323f7369c412c0402e139eb5ace44a6fec9798f1a8bbed8ba17aecd5ba'}, 'watch.html': {'before': '6fe37b63151194a21a5a42fa05e61540ae6183e8ace08c01fb5922e6f29d2029', 'after': '253f7cc06745d94f858b1577189ef171ac4aa4e25e7b2716c6c5ef81ea9e5e3f'}, 'videos-p1.html': {'before': '33275d128cb46065b6319ecf79fb6bc7edffc23638a0897586d6599ae730ac56', 'after': 'bf54a65925cbec9c0125ed42e320f282c367162b659302876ea24e71575ac713'}, 'explain-p1-u1.html': {'before': '3cc3ce004362fb6be7efc940fecb4f77d999d3091d116de3ebc32d3b4e3f5bae', 'after': '5f184eb571d99d1966bd24ee17971722fa291dbcccd011d9dbfad708810507cc'}, 'videos/P1_U1_AR_full_word_lesson.jpg': {'before': None, 'after': '026b82db56add3ad01ea605d22ffc5d8fd01f12f2151f827f693d695aee61661'}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
            p=json.loads(z.read('transfer.json'));assert p['files']==expected
            assert set(z.namelist())==set(expected)|{'transfer.json'}
            for n,v in expected.items():
              f=pathlib.Path(n);assert sha(f.read_bytes() if f.exists() else None)==v['before'],n
              assert sha(z.read(n))==v['after'],n
            for n in expected:
              f=pathlib.Path(n);f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(z.read(n))
          subprocess.run(['node','--check','grade-videos.js'],check=True)
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(expected),check=True)
          subprocess.run(['git','commit','-m','Connect exact checked P1 Unit1 full lesson video'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
