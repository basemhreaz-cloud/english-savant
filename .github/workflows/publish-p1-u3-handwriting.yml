name: Publish checked P1 U3 handwriting practice
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate only two checked handwriting files
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess
          files={'p1-handwriting.js': {'before': 'f26b1668efba54b8f651b6a0f9748ac469e88546583d79bad489ab8906123b25', 'after': '31050c448ecc7dac90e1c8ade82c0835dd8e4d294734fef275b741406e3beb19', 'base64': ''}, 'explain-p1-u3.html': {'before': '2356a4dce1ab049594383933e57152909b366717fe792b128f253d3528f3f0e4', 'after': 'ca1b0047693d67a3f88672a64286f3c4ed188090a1a62161f720d2e1d893b6fd', 'base64': ''}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(base64.b64decode(v['base64']))==v['after'],n
          for n,v in files.items():pathlib.Path(n).write_bytes(base64.b64decode(v['base64']))
          subprocess.run(['node','--check','p1-handwriting.js'],check=True)
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Add checked unscored P1 U3 handwriting practice'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
