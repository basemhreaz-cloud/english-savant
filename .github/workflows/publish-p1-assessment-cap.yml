name: Apply requested sixty-question lesson cap
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate only two reviewed lesson cap files
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess,gzip
          files={'lesson-assessment-p1-u3.json': {'before': '984b3faed3e31ee0dfa67e2c03e8449331f9294df08ba96040ba0387ddc0d512', 'after': '3e93102cbc9de2a08d9b496a88aa7c9950c5fb5a26accc689bb2f4f0627eda84', 'base64': ''}, 'lesson-assessment-p1-u5.json': {'before': '35049cae1b27ec140e420fa4033622ef01ed75ac2fb0d0151da911f8465651fb', 'after': '131384157069f0486c47adc0cde67800cf66478b6aceb6f8ac59b6c2003dd31c', 'base64': ''}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(gzip.decompress(base64.b64decode(v['base64'])))==v['after'],n
          for n,v in files.items():pathlib.Path(n).write_bytes(gzip.decompress(base64.b64decode(v['base64'])))
          assert sum(len(__import__('json').loads(pathlib.Path('lesson-assessment-p1-u'+str(u)+'.json').read_text()))for u in range(1,7))==1172
          assert len(__import__('json').loads(pathlib.Path('p1-unit-exam-u3.json').read_text()))==37
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Apply requested sixty-question cap preserving lesson variety'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
