name: Library and homepage additions after header fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded interface additions
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,re,base64,zlib
          frozen={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.suffix in ['.js','.json'] and str(p) not in ['sw.js','site-interface.js']}
          p=pathlib.Path('site-interface.js');assert hashlib.sha256(p.read_bytes()).hexdigest()=='627275894430ff42d0756f57d4fcaa9cd49a6b2af865844a051b1309fd5e448f';p.write_bytes(p.read_bytes()+zlib.decompress(base64.b64decode('')))
          p=pathlib.Path('site-interface.css');assert hashlib.sha256(p.read_bytes()).hexdigest()=='1240822d808ea4fe475bb4d1c830474a310f8ce6ae0da875cbd421bfa4f0e2b0';p.write_bytes(p.read_bytes()+zlib.decompress(base64.b64decode('eJwNyTEOwjAMAMA9rzADS6WmMLAUiYWXOLaVRJQ4cpwJ8Xe49cK2wLMazQMNBmaBhPRi0w5JSm0MXgRmo4ItC8OhWYHQOMKyhVjEdEVzeEBUS5+kxmKrIdc59tvlfKrvrubY/I6jC/n/vOp+/YYfKUYqfA==')))
          for p in pathlib.Path('.').glob('*.html'):
           if p.name.startswith('google'):continue
           s=p.read_text();s=re.sub(r'site-interface\.(css|js)\?v=[^"\s>]+',r'site-interface.\1?v=20261123-library59',s);p.write_text(s)
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v58-header' in s;p.write_text(s.replace('english-savant-v58-header','english-savant-v59-library'))
          assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in frozen.items()),'educational code/data changed'
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add '*.html' site-interface.js site-interface.css sw.js
          git commit -m "Add Library navigation, WhatsApp social button and circular hero backdrop"
          git push origin HEAD:main
