name: Publish reviewed P2 Unit 2 assessment batch
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish tested P2 lesson bank and entry links
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess,gzip
          files=eval(gzip.decompress(base64.b64decode(''.join(pathlib.Path('.github/workflows/p2-u2-payload-'+str(i)+'.txt').read_text() for i in range(2)))))
          files.update({'lesson-assessment-p2-u2.json': {'before': None, 'after': 'd377c17aa64e76e6545b79bb2063b4469118c4da8a4e046017682ed71912edf2', 'base64': ''}, 'p2-lessons-assets/img/cup.png': {'before': None, 'after': '173d56619fe066d7e281e614501a937975a262db644c2ef061fd6a8b35235f02', 'base64': ''}, 'p2-lessons-assets/img/five-books.png': {'before': None, 'after': 'd8092563f9462e98e834f291e8d0ce888511780c62d09355b81224d11f80b385', 'base64': ''}, 'p2-lessons-assets/img/orange-triangle.png': {'before': None, 'after': 'ea7ce1c69ef9f8fdc894e14bd7540484fcf335be1686385e00421c7ac9746fc3', 'base64': ''}})
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(gzip.decompress(base64.b64decode(v['base64'])))==v['after'],n
          for n,v in files.items():
            p=pathlib.Path(n);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(gzip.decompress(base64.b64decode(v['base64'])))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Publish reviewed P2 Unit 2 assessment batch'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
