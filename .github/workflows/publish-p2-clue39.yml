name: Clarify P2 Unit6 balcony clue
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 <<'PYCODE'
          import json,pathlib,base64
          p=pathlib.Path('es-bank-p2-u6.json');d=json.loads(p.read_text());q=next(x for x in d['questions']if x['id']==29);assert q['answer']=='balcony';assert q['prompt']=='I read on the ___ in the morning.';q.update(json.loads(base64.b64decode('eyJwcm9tcHQiOiAiSSByZWFkIG9uIHRoZSBfX18gaW4gdGhlIG1vcm5pbmcuICjYp9mE2LTYsdmB2KkpIiwgImV4cGxhbmF0aW9uX2FyIjogItin2YTYtNix2YHYqSDYqNin2YTYpdmG2KzZhNmK2LLZiiBiYWxjb255LiDZg9mE2YXYqSDYp9mE2LTYsdmB2Kkg2YfZiiDYp9mE2K/ZhNmK2YQg2YfZhtin2Iwg2YXYtCDZiNmC2Kog2KfZhNmC2LHYp9ih2KkuIn0=')));p.write_text(json.dumps(d,ensure_ascii=False,indent=2))
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v38-p2-u3-video'in s;p.write_text(s.replace('english-savant-v38-p2-u3-video','english-savant-v39-p2-clear-clue'))
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add es-bank-p2-u6.json sw.js
          git commit -m 'Give P2 Unit6 balcony completion an explicit clue'
          git push origin HEAD:main
