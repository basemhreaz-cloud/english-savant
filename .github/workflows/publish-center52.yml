name: Center shared UI labels and icons
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual centering with source preservation guards
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,base64,zlib,re,json
          expected={'site-interface.css': 'e801e9555946bfada5d5ca3d101b869610eeb9f4664923630a1fbc3ce552b1ad', 'site-interface.js': '8773ffc98fdebe45b8e49f61e7b45e01b1f4aeb1a22a101a2b1dcfbb636b167b'}
          for n,h in expected.items():assert hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h,n
          frozen={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.suffix in ['.js','.json'] and str(p) not in ['sw.js','site-interface.js']}
          payload=json.loads(zlib.decompress(base64.b64decode('')))
          for n,b in payload.items():pathlib.Path(n).write_bytes(base64.b64decode(b))
          for p in pathlib.Path('.').glob('*.html'):
           if p.name.startswith('google'):continue
           s=p.read_text()
           for n in ['site-interface.css','site-interface.js']:s=re.sub(re.escape(n)+r'\?v=[^"\s>]+',n+'?v=20261123-center52',s)
           p.write_text(s)
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v51-glass' in s;p.write_text(s.replace('english-savant-v51-glass','english-savant-v52-center'))
          assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in frozen.items()),'educational code/data changed'
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add '*.html' site-interface.css site-interface.js sw.js
          git commit -m "Center shared UI symbols and short control labels"
          git push origin HEAD:main
