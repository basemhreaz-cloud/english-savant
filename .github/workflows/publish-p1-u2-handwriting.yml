name: Publish checked P1 U2 handwriting practice
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate only three checked handwriting files
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess
          files={'p1-handwriting.js': {'before': '091a9125780908e506eddc1016950b284c7233bb86fa6029f9ccc7a232c0cd71', 'after': 'f26b1668efba54b8f651b6a0f9748ac469e88546583d79bad489ab8906123b25', 'base64': ''}, 'explain-p1-u2.html': {'before': '5653484ba6f501620dddc42b6d0013a435240c8df805abcb8a80b2e38ec25d59', 'after': '845ffb3ebf427866ef5be7837fa6c93204cd5c46b18a102ff05aa3d261988ca8', 'base64': ''}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(base64.b64decode(v['base64']))==v['after'],n
          for n,v in files.items():pathlib.Path(n).write_bytes(base64.b64decode(v['base64']))
          subprocess.run(['node','--check','p1-handwriting.js'],check=True)
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Add checked unscored P1 U2 handwriting practice'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
