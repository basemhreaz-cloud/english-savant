          )
          b=gzip.decompress(base64.b64decode(encoded));assert hashlib.sha256(b).hexdigest()=='5ec5cd6f7bf2805a27be9f757482553f698f42180b6ff834104ced3a1122dba7';f.write_bytes(b)
          changed=['site-interface.js']
          for f in pathlib.Path('.').glob('*.html'):
           s=f.read_text();t=re.sub(r'site-interface\.(js|css)(?:\?v=[A-Za-z0-9_-]+)?',lambda m:'site-interface.'+m[1]+'?v=20261123-labels28',s)
           if s!=t:f.write_text(t);changed.append(str(f))
          f=pathlib.Path('sw.js');s=f.read_text();t=s.replace('english-savant-v26-glass','english-savant-v28-labels');assert t!=s;f.write_text(t);changed.append('sw.js')
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',*changed],check=True)
          subprocess.run(['git','commit','-m','Translate remaining interface instructions'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
