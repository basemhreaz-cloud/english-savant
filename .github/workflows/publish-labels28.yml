concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 <<'PYCODE'
          import pathlib,hashlib,base64,gzip,subprocess,re
          f=pathlib.Path('site-interface.js');assert hashlib.sha256(f.read_bytes()).hexdigest()=='7f4d344f5a9d17bb4f5bbe9043bd1ca88f9346db06100a94cb11be46de477bd6'
          encoded=(
          ''
