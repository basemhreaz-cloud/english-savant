name: Compact footer and align card edges
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested shared CSS only
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,base64,re
          p=pathlib.Path('site-interface.css');assert hashlib.sha256(p.read_bytes()).hexdigest()=='2ce6c2f1dbfe3b4a8fd9676fda6c0f6bb54c8468c01c7a1a0bfaa77b353e1914';p.write_bytes(base64.b64decode(''))
          for p in pathlib.Path('.').glob('*.html'):
           s=p.read_text();s=re.sub(r'site-interface\.css\?v=[^"\s>]+','site-interface.css?v=20261123-polish46',s);p.write_text(s)
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v45-search-progress' in s;p.write_text(s.replace('english-savant-v45-search-progress','english-savant-v46-polish'))
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add site-interface.css '*.html' sw.js
          git commit -m 'Compact footer and align existing card edges'
          git push origin HEAD:main
