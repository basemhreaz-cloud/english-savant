name: Connect checked P1 Unit2 full lesson video
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate only six checked P1 Unit2 player files
        run: |
          python3 <<'PYCODE'
          import pathlib,base64,hashlib,subprocess,gzip
          files={'lessons.json': {'before': '0ec5edfa7c49066d950eb911288028265a94fa355962d3b914822d9134ea865d', 'after': 'b63e04e22d5eea9150e25a603848b1e7d7476c419ce9615196fdbe7cab5bb061', 'base64': ''}, 'grade-videos.js': {'before': '9784ed323f7369c412c0402e139eb5ace44a6fec9798f1a8bbed8ba17aecd5ba', 'after': '76be231313cd94cc466e27c8d8babe9cfd8a9652707fa54c72dc194ab601999b', 'base64': ''}, 'watch.html': {'before': '253f7cc06745d94f858b1577189ef171ac4aa4e25e7b2716c6c5ef81ea9e5e3f', 'after': '04afa29cb0dde20c26f36c0b99f03c3530ba98c3a5c363d051b6fd8064efc30d', 'base64': ''}, 'videos-p1.html': {'before': 'bf54a65925cbec9c0125ed42e320f282c367162b659302876ea24e71575ac713', 'after': '36ed743ffc8603b89684b7ac57ab3af2aa22b80bed6a70b5577b519864b435e1', 'base64': ''}, 'explain-p1-u2.html': {'before': '845ffb3ebf427866ef5be7837fa6c93204cd5c46b18a102ff05aa3d261988ca8', 'after': 'fbb165941a57420f78d00f5d18481ff2d769e1855067dca97fb6089ce3168b97', 'base64': ''}, 'videos/P1_U2_AR_full_word_lesson.jpg': {'before': None, 'after': '20908a417b4d5d54cc1ab735ff93be41a995fc165ae2cac7611985f87446a515', 'base64': ''}}
          def sha(b):return hashlib.sha256(b).hexdigest() if b is not None else None
          for n,v in files.items():
            p=pathlib.Path(n);assert sha(p.read_bytes() if p.exists() else None)==v['before'],n
            assert sha(gzip.decompress(base64.b64decode(v['base64'])))==v['after'],n
          for n,v in files.items():pathlib.Path(n).write_bytes(gzip.decompress(base64.b64decode(v['base64'])))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(files),check=True)
          subprocess.run(['git','commit','-m','Connect checked P1 Unit2 full lesson video'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
