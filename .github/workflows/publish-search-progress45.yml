name: Add checked lesson search and progress
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested search and progress without content changes
        run: |
          python3 - <<'PYCODE'
          import pathlib,json,gzip,base64,hashlib,re
          x=json.loads(gzip.decompress(base64.b64decode('')))
          for name,v in x['replace'].items():
           p=pathlib.Path(name);assert hashlib.sha256(p.read_bytes()).hexdigest()==v['sha'],name;p.write_text(v['new'])
          for name,s in x['new'].items():
           p=pathlib.Path('tools/build_search_index.py' if name=='build_search_index.py' else name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(s)
          for p in pathlib.Path('.').glob('*.html'):
           s=p.read_text()
           if p.name in ['assess-p2-u'+str(i)+'.html' for i in range(1,7)]:
            assert s.count("function updateBar(){prog.textContent=done+' / '+total;")==1,p.name;s=s.replace("function updateBar(){prog.textContent=done+' / '+total;","function updateBar(){prog.textContent=done+' / '+total;var meter=root.querySelector('.quiz-progress');if(!meter){meter=document.createElement('div');meter.className='quiz-progress';meter.setAttribute('role','progressbar');meter.setAttribute('aria-label','الأسئلة المجاب عنها في المحطة');meter.setAttribute('aria-valuemin','0');meter.appendChild(document.createElement('span'));prog.parentNode.insertBefore(meter,prog.nextSibling)}meter.setAttribute('aria-valuemax',String(total));meter.setAttribute('aria-valuenow',String(done));meter.setAttribute('aria-valuetext',done+' من '+total+' أسئلة مجاب عنها');meter.firstChild.style.width=(total?done/total*100:0)+'%';")
           if 'site-search.js' not in s:s=s.replace('</head>','<link rel="stylesheet" href="site-search.css?v=20261123-search45"><script defer src="site-search.js?v=20261123-search45"></script></head>')
           s=re.sub(r'(lesson-assessment-p[12]\.js|final-review-p2\.js)\?v=[^"\s>]+',lambda m:m.group(1)+'?v=20261123-progress45',s)
           s=re.sub(r'site-interface\.(js|css)\?v=[^"\s>]+',lambda m:'site-interface.'+m.group(1)+'?v=20261123-search45',s)
           p.write_text(s)
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v44-booking' in s;p.write_text(s.replace('english-savant-v44-booking','english-savant-v45-search-progress'))
          PYCODE
          python3 tools/build_search_index.py
          node --check site-search.js
          node --check lesson-assessment-p1.js
          node --check lesson-assessment-p2.js
          node --check final-review-p2.js
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add '*.html' site-interface.css site-search.js site-search.css search-index.json tools/build_search_index.py lesson-assessment-p1.js lesson-assessment-p2.js final-review-p2.js sw.js
          git commit -m 'Add indexed lesson search and accessible quiz position bars'
          git push origin HEAD:main
