name: Custom branded in-page selection controls
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded interface additions
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,re,base64,zlib
          frozen={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.suffix in ['.js','.json'] and str(p) not in ['sw.js','site-interface.js']}
          p=pathlib.Path('site-interface.js');assert hashlib.sha256(p.read_bytes()).hexdigest()=='72d27ca942449a904f85f314ac2a67bada1ef60ebc9804833341f3f8042a0c30';p.write_bytes(p.read_bytes()+zlib.decompress(base64.b64decode('')))
          p=pathlib.Path('site-interface.css');assert hashlib.sha256(p.read_bytes()).hexdigest()=='981a53fa7d474db6be29d6c76f0fff2ba04fa66b7315cf514d5576e374524a09';p.write_bytes(p.read_bytes()+zlib.decompress(base64.b64decode('')))
          for p in pathlib.Path('.').glob('*.html'):
           if p.name.startswith('google'):continue
           s=p.read_text();s=re.sub(r'site-interface\.(css|js)\?v=[^"\s>]+',r'site-interface.\1?v=20261123-select60',s);p.write_text(s)
          p=pathlib.Path('sw.js');s=p.read_text();assert 'english-savant-v59-library' in s;p.write_text(s.replace('english-savant-v59-library','english-savant-v60-select'))
          assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in frozen.items()),'educational code/data changed'
          PYCODE
          git config user.name basemhreaz-cloud
          git config user.email basemhreaz-cloud@users.noreply.github.com
          git add '*.html' site-interface.js site-interface.css sw.js
          git commit -m "Use branded in-page selection lists and bound P2 section menu"
          git push origin HEAD:main
