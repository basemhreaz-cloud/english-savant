name: Publish KG2 checked warm-up additions
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Download exact private checked transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/releases > /tmp/releases.json
          python3 - <<'PY'
          import json,pathlib
          rows=[r for r in json.load(open('/tmp/releases.json')) if r['draft'] and r['name']=='KG2 checked warm-up transfer' and [a['id'] for a in r['assets']]==[779470700]]
          assert len(rows)==1,'Transfer mismatch'
          pathlib.Path('/tmp/draft-id').write_text(str(rows[0]['id']))
          PY
          gh api -H 'Accept: application/octet-stream' repos/$GITHUB_REPOSITORY/releases/assets/779470700 > /tmp/checked.zip
      - name: Verify and publish only checked activity files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,json,hashlib,subprocess,urllib.request,os
          b=pathlib.Path('/tmp/checked.zip').read_bytes()
          assert hashlib.sha256(b).hexdigest()=='1acebe46d62db800ea753c970cdc07e01190ff50b2e10ac23d71685ad9415a48','Transfer integrity'
          with zipfile.ZipFile('/tmp/checked.zip') as z:
              p=json.loads(z.read('transfer.json')); names=set(p['files'])
              assert len(names)==108 and p['new_activities']==6 and p['picture_pairs']==34 and p['new_clips']==68 and set(z.namelist())==names|{'transfer.json'}
              for name,v in p['files'].items():
                  q=pathlib.PurePosixPath(name);assert not q.is_absolute() and '..' not in q.parts
                  assert hashlib.sha256('\n'.join(sorted(names)).encode()).hexdigest()=='0316545f5d0b8c7724b22e37b5521fc38f38993815020cb285109e3251c68d3e'
                  f=pathlib.Path(name)
                  assert (hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else None)==v['before'],'Concurrent change: '+name
                  assert hashlib.sha256(z.read(name)).hexdigest()==v['after'],'File integrity: '+name
              for name in names:
                  f=pathlib.Path(name);f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(z.read(name))
          subprocess.run(['git','config','user.name','basemhreaz-cloud'],check=True)
          subprocess.run(['git','config','user.email','basemhreaz-cloud@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(names),check=True)
          subprocess.run(['git','commit','-m','Publish checked KG2 warm-up and correct video status notes'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY
      - name: Remove only the consumed private transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(cat /tmp/draft-id)
          gh api repos/$GITHUB_REPOSITORY/releases/$draft > /tmp/used-draft.json
          python3 -c "import json; p=json.load(open('/tmp/used-draft.json')); assert p['draft'] is True and p['name']=='KG2 checked warm-up transfer' and [a['id'] for a in p['assets']]==[779470700]"
          gh api --method DELETE repos/$GITHUB_REPOSITORY/releases/$draft

