name: Host checked Primary1 Unit6 full lesson
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-savant-verified-bank-batch
  cancel-in-progress: false
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact private parts and losslessly assemble checked master
        run: |
          python3 <<'PYCODE'
          import json,subprocess,hashlib,pathlib,os
          m={'master': {'filename': 'P1_U6_AR_full_word_lesson.mp4', 'bytes': 175135904, 'sha256': '2dc5f0ea1fcebfbd5e562dde8a1adb41301d22110e1516bf39a71d584778f45f'}, 'parts': [{'name': 'P1_U6_AR_full_word_lesson.mp4.part01', 'bytes': 18000000, 'sha256': 'a143724da84e7d0ad431725b3349fa1be6b7fac118552945893683080c45d50d', 'asset_id': 781497017, 'asset_name': '11-P1_U6.part01.bin'}, {'name': 'P1_U6_AR_full_word_lesson.mp4.part02', 'bytes': 18000000, 'sha256': '0429d63215e202b977816251c19d252095d61280542a278c61f33eb0738cc366', 'asset_id': 781499860, 'asset_name': '20-P1_U6.part02.bin'}, {'name': 'P1_U6_AR_full_word_lesson.mp4.part03', 'bytes': 18000000, 'sha256': '0273e9f12b5d76bc7cbc67b9ec816613392096fc73e1f589986db484d6e0ef18', 'asset_id': 781498844, 'asset_name': '12-P1_U6.part03.bin'}, {'name': 'P1_U6_AR_full_word_lesson.mp4.part04', 'bytes': 18000000, 'sha256': 'f463805bf4df9486131e8cbaab663a15010d513ad3106849b7535a0648e02c53', 'asset_id': 781498923, 'asset_name': '13-P1_U6.part04.bin'}, {'name': 'P1_U6_AR_full_word_lesson.mp4.part05', 'bytes': 18000000, 'sha256': 'd783cfd0616af28bdde9cde6c63932044d9f7759de357b5f76aa3ae7edf84cee', 'asset_id': 781499019, 'asset_name': '14-P1_U6.part05.bin'}, {'name': 'P1_U6_AR_full_word_lesson.mp4.part06', 'bytes': 18000000, 'sha256': '7bdd46dcc8b1d930f538164ddd0216fe2d120700fa424c2855d25838c1f65c52', 'asset_id': 781499151, 'asset_name': '15-P1_U6.part06.bin'}, {'name': 'P1_U6_AR_full_word_lesson.mp4.part07', 'bytes': 18000000, 'sha256': 'f5907a485a21f6c813cf98dee0494417ec9bba6943571950af233e3d346ca1f2', 'asset_id': 781499230, 'asset_name': '16-P1_U6.part07.bin'}, {'name': 'P1_U6_AR_full_word_lesson.mp4.part08', 'bytes': 18000000, 'sha256': 'e611774bab3af85c129936b6d1ba09ef610bfb24adc414a76049a4c3125fb188', 'asset_id': 781499328, 'asset_name': '17-P1_U6.part08.bin'}, {'name': 'P1_U6_AR_full_word_lesson.mp4.part09', 'bytes': 18000000, 'sha256': 'bd1ba7b9afa5cde9c710c11cbb0f78d5693dcc890945ebf9bc16898b2c7184b5', 'asset_id': 781499412, 'asset_name': '18-P1_U6.part09.bin'}, {'name': 'P1_U6_AR_full_word_lesson.mp4.part10', 'bytes': 13135904, 'sha256': 'ac902ed24cba53349bcaaaa8dbb92bebc87a868e0634414e09af572fe81e7185', 'asset_id': 781499463, 'asset_name': '19-P1_U6.part10.bin'}], 'draft_id': 454981319, 'draft_url': 'https://github.com/basemhreaz-cloud/english-savant/releases/edit/untagged-572387de4ddbc6b1be8a'}
          repo=os.environ['GITHUB_REPOSITORY']
          p=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases/'+str(m['draft_id'])]))
          assert p['draft'] and p['name']=='P1 Unit6 verified master transfer'
          actual={a['id']:a for a in p['assets']}
          assert set(actual)=={a['asset_id'] for a in m['parts']}
          path=pathlib.Path('/tmp/P1_U6_AR_full_word_lesson.mp4')
          with path.open('wb') as out:
            for a in m['parts']:
              row=actual[a['asset_id']];assert row['size']==a['bytes'] and row['name']==a['asset_name']
              b=subprocess.check_output(['gh','api','-H','Accept: application/octet-stream','repos/'+repo+'/releases/assets/'+str(a['asset_id'])])
              assert len(b)==a['bytes'] and hashlib.sha256(b).hexdigest()==a['sha256']
              out.write(b)
          assert path.stat().st_size==m['master']['bytes'] and hashlib.sha256(path.read_bytes()).hexdigest()==m['master']['sha256']
          subprocess.run(['gh','release','create','p1-u6-full-lesson-20261123',str(path),'--repo',repo,'--title','Primary 1 Unit 6 full lesson','--notes','Egyptian Arabic explanation of the four Primary 1 Unit 6 lessons. ENGLISH SAVANT, Mr. Basem Hreaz.','--latest=false'],check=True)
          p=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases/tags/p1-u6-full-lesson-20261123']))
          assert not p['draft'] and len(p['assets'])==1
          a=p['assets'][0];assert a['size']==m['master']['bytes'] and a['name']==path.name
          if a.get('digest'):assert a['digest']=='sha256:'+m['master']['sha256']
          print('Verified hosted exact master:',a['browser_download_url'])
          PYCODE
